name: bootstrap diffDay index hotfix

on:
  push:
    branches:
      - gpt/fix-diffday-calendar-day-20260906
    paths:
      - '.github/workflows/bootstrap-diffday-index.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gpt/fix-diffday-calendar-day-20260906
          fetch-depth: 0

      - name: Apply exact calendar-day replacement
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = "function diffDay(s){const d=parseDate(s);if(!d)return null;return Math.ceil((d-today0())/86400000)}"
          new = "function diffDay(s){const d=parseDate(s);if(!d)return null;const end=new Date(d.getFullYear(),d.getMonth(),d.getDate());return Math.round((end-today0())/86400000)}"
          if s.count(old) != 1:
              raise SystemExit(f'expected exactly one legacy diffDay signature, found {s.count(old)}')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Run deterministic regression
        run: node tests/test_diffday_calendar.js

      - name: Commit hotfix and remove bootstrap workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/bootstrap-diffday-index.yml
          git add index.html
          git commit -m 'Fix diffDay calendar-day semantics'
          git push origin HEAD:gpt/fix-diffday-calendar-day-20260906
