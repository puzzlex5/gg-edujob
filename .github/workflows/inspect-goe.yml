name: Test full Gyeonggi collector

on:
  push:
    paths:
      - '.github/workflows/inspect-goe.yml'

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4
      - name: Run full collector
        run: python scripts/scrape_jobs.py
      - name: Commit result
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add jobs.json
          git commit -m 'Update recruitment data' || exit 0
          git push
