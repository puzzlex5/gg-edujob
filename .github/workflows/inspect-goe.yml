name: Inspect GOE page

on:
  push:
    paths:
      - '.github/workflows/inspect-goe.yml'

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch official recruitment page
        run: |
          python - <<'PY'
          import urllib.request
          url='https://www.goe.go.kr/recruit/ad/func/pb/hnfpPbancList.do?mi=10502'
          req=urllib.request.Request(url, headers={'User-Agent':'Mozilla/5.0'})
          with urllib.request.urlopen(req, timeout=30) as r:
              data=r.read()
          open('goe-debug.html','wb').write(data)
          print('bytes',len(data))
          PY
      - name: Commit fetched HTML
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add goe-debug.html
          git commit -m 'Inspect GOE page structure [skip ci]' || exit 0
          git push
