name: Update 수도권 education jobs

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/scrape_jobs.py'
      - 'scripts/repair_gyeonggi_support.py'
      - 'scripts/complete_support_coverage.py'
      - 'scripts/hotfix_completeness_cap.py'
      - 'scripts/verify_support_completeness.py'
      - 'scripts/hotfix_desktop_scroll.py'
      - 'scripts/resolve_support_links.py'
      - 'scripts/enrich_support_periods.py'
      - 'scripts/enrich_seoul_get_fallback.py'
      - 'scripts/verify_jobs.py'
      - 'scripts/hotfix_support_office.py'
      - 'scripts/hotfix_repair_links.py'
      - 'scripts/hotfix_sources.py'
      - 'sources.json'
      - '.github/workflows/update-jobs.yml'
  schedule:
    - cron: '17 * * * *' # 매시간 17분(UTC), KST도 매시간 17분에 전체 수집/검증

permissions:
  contents: write

concurrency:
  group: metro-edujob-data
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install collector dependencies
        run: pip install requests beautifulsoup4
      - name: Preserve newest valid published data for anomaly comparison and rollback
        shell: bash
        run: |
          set -euo pipefail
          is_valid_jobs() {
            python - "$1" <<'PY'
          import json, sys
          from pathlib import Path
          p = Path(sys.argv[1])
          try:
              data = json.loads(p.read_text(encoding='utf-8'))
              jobs = data.get('jobs', []) if isinstance(data, dict) else []
              ok = len(jobs) >= 100
          except Exception:
              ok = False
          raise SystemExit(0 if ok else 1)
          PY
          }

          if is_valid_jobs jobs.json; then
            cp jobs.json /tmp/jobs_previous.json
            echo 'Current jobs.json is a valid rollback snapshot.'
          else
            echo 'Current jobs.json is empty/corrupt; searching Git history for the newest valid snapshot.'
            found=''
            while read -r commit; do
              [ -n "$commit" ] || continue
              if git show "${commit}:jobs.json" > /tmp/jobs_candidate.json 2>/dev/null && is_valid_jobs /tmp/jobs_candidate.json; then
                cp /tmp/jobs_candidate.json /tmp/jobs_previous.json
                found="$commit"
                echo "Recovered valid jobs.json snapshot from $commit"
                break
              fi
            done < <(git rev-list HEAD -- jobs.json)

            if [ -z "$found" ]; then
              echo 'No valid historical jobs.json snapshot exists; refusing to risk publishing an empty dataset.' >&2
              exit 1
            fi
            cp /tmp/jobs_previous.json jobs.json
          fi
      - name: Apply targeted official-source board fixes
        run: python scripts/hotfix_sources.py
      - name: Apply support-office parser and exact-link compatibility fixes
        run: |
          python scripts/hotfix_support_office.py
          python scripts/hotfix_repair_links.py
          python scripts/hotfix_completeness_cap.py
          python scripts/hotfix_desktop_scroll.py
          python -m py_compile scripts/scrape_jobs.py scripts/repair_gyeonggi_support.py scripts/complete_support_coverage.py scripts/resolve_support_links.py scripts/enrich_support_periods.py scripts/enrich_seoul_get_fallback.py scripts/hotfix_completeness_cap.py scripts/verify_support_completeness.py scripts/hotfix_desktop_scroll.py
          grep -q 'MAX_PAGES = 500' scripts/complete_support_coverage.py
          grep -q 'pages < MAX_PAGES' scripts/complete_support_coverage.py
          grep -q 'detailLinkResolved' index.html
          grep -q 'overscroll-behavior-y:contain' index.html
          grep -q '@media (hover:hover) and (pointer:fine)' index.html
          grep -q 'subject_parts=' scripts/scrape_jobs.py
          grep -q 'data_id = clean(str(a.get("data-id", "")))' scripts/scrape_jobs.py
          grep -q 'data_id = clean(str(a.get("data-id", "")))' scripts/repair_gyeonggi_support.py
      - name: Collect central and all support-office recruitment boards
        run: python scripts/scrape_jobs.py
      - name: Deduplicate stale MirCMS menu aliases in board cache
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from urllib.parse import parse_qs, urlparse
          p = Path('board_cache.json')
          cache = json.loads(p.read_text(encoding='utf-8')) if p.exists() else {}
          cleaned = {}
          removed = 0
          for office, urls in cache.items():
              seen = set()
              keep = []
              for u in urls:
                  q = parse_qs(urlparse(u).query, keep_blank_values=True)
                  bbs = (q.get('bbsId') or [''])[0]
                  key = (
                      (urlparse(u).hostname or '').lower(),
                      urlparse(u).path,
                      bbs,
                      (q.get('srch_aditCol1') or [''])[0],
                      (q.get('clasHmpgId') or [''])[0],
                  )
                  if bbs and key in seen:
                      removed += 1
                      continue
                  seen.add(key)
                  keep.append(u)
              cleaned[office] = keep
          p.write_text(json.dumps(cleaned, ensure_ascii=False, indent=2), encoding='utf-8')
          print(f'Removed {removed} duplicate MirCMS menu aliases from board_cache.json')
          PY
      - name: Repair and re-check all 25 Gyeonggi support-office boards
        run: python scripts/repair_gyeonggi_support.py
      - name: Crawl support offices dynamically through the full recent look-back window
        run: python scripts/complete_support_coverage.py
      - name: Resolve exact individual support-office posting links
        run: python scripts/resolve_support_links.py
      - name: Enrich application and hiring periods from exact support-office details
        run: python scripts/enrich_support_periods.py
      - name: Retry Seoul support-office detail periods with GET fallback
        run: python scripts/enrich_seoul_get_fallback.py
      - name: Require complete 25+11 support-office traversal evidence
        run: |
          if ! python scripts/verify_support_completeness.py; then
            echo 'Support-office completeness is not proven. Restoring the newest known-good jobs.json.'
            cp /tmp/jobs_previous.json jobs.json
            exit 1
          fi
      - name: Independent second-pass verification
        run: |
          if ! python scripts/verify_jobs.py --previous /tmp/jobs_previous.json; then
            echo 'Critical validation failure. Restoring the newest known-good jobs.json.'
            cp /tmp/jobs_previous.json jobs.json
            exit 1
          fi
      - name: Final guard against empty/corrupt publication
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('jobs.json')
          data = json.loads(p.read_text(encoding='utf-8'))
          jobs = data.get('jobs', []) if isinstance(data, dict) else []
          if len(jobs) < 100:
              raise SystemExit(f'Refusing publication: only {len(jobs)} jobs in jobs.json')
          print(f'Publication guard passed: {len(jobs)} jobs')
          PY
      - name: Commit verified jobs, exact-link report, period cache, and corrected collectors
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '4189828+github-actions[bot]@users.noreply.github.com'
          git add jobs.json board_cache.json index.html scripts/scrape_jobs.py scripts/repair_gyeonggi_support.py scripts/complete_support_coverage.py support_link_resolution.json support_period_cache.json sources.json
          git diff --cached --quiet && exit 0
          git commit -m 'Refresh verified jobs with complete support-office coverage'
          git pull --rebase
          git push

# Hourly path intentionally excludes the expensive link-structure snapshot diagnostic.
# Exact-link resolution and 25+11 completeness verification still run every hour.
