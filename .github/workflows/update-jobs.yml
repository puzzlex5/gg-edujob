name: Update 수도권 education jobs

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/scrape_jobs.py'
      - 'scripts/repair_gyeonggi_support.py'
      - 'scripts/resolve_support_links.py'
      - 'scripts/verify_jobs.py'
      - 'scripts/hotfix_support_office.py'
      - 'scripts/hotfix_sources.py'
      - 'scripts/diagnose_support_links.py'
      - 'sources.json'
      - '.github/workflows/update-jobs.yml'
  schedule:
    - cron: '5 22 * * *' # 07:05 KST - 1차 수집/검증
    - cron: '5 23 * * *' # 08:05 KST - 2차 재수집/재검증

permissions:
  contents: write

concurrency:
  group: metro-edujob-data
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install collector dependencies
        run: pip install requests beautifulsoup4
      - name: Preserve previous data for anomaly comparison
        run: cp jobs.json /tmp/jobs_previous.json || true
      - name: Apply targeted official-source board fixes
        run: python scripts/hotfix_sources.py
      - name: Diagnose exact support-office detail-link structures
        run: python scripts/diagnose_support_links.py
      - name: Save source fixes and link diagnostics for repair analysis
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sources.json support_link_diagnostics.json
          if ! git diff --cached --quiet; then
            git commit -m 'Record source and support-link diagnostics'
            git pull --rebase
            git push
          fi
      - name: Apply support-office parser and frontend compatibility fixes
        run: |
          python scripts/hotfix_support_office.py
          python -m py_compile scripts/scrape_jobs.py scripts/repair_gyeonggi_support.py scripts/resolve_support_links.py
          grep -q 'detailLinkResolved' index.html
          grep -q 'subject_parts=' scripts/scrape_jobs.py
      - name: Collect central and all support-office recruitment boards
        run: python scripts/scrape_jobs.py
      - name: Repair and re-check all 25 Gyeonggi support-office boards
        run: python scripts/repair_gyeonggi_support.py
      - name: Resolve exact individual support-office posting links
        run: python scripts/resolve_support_links.py
      - name: Independent second-pass verification
        run: |
          if ! python scripts/verify_jobs.py --previous /tmp/jobs_previous.json; then
            echo 'Critical validation failure. Keeping the previously published jobs.json.'
            cp /tmp/jobs_previous.json jobs.json
            exit 1
          fi
      - name: Commit verified jobs, exact-link report, and discovered board cache
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add jobs.json board_cache.json index.html scripts/scrape_jobs.py support_link_resolution.json sources.json
          git diff --cached --quiet && exit 0
          git commit -m 'Refresh verified jobs with exact support-office links'
          git pull --rebase
          git push

