name: Update 수도권 education jobs

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/scrape_jobs.py'
      - 'scripts/repair_gyeonggi_support.py'
      - 'scripts/complete_support_coverage.py'
      - 'scripts/resolve_support_links.py'
      - 'scripts/enrich_support_periods.py'
      - 'scripts/enrich_seoul_get_fallback.py'
      - 'scripts/verify_support_completeness.py'
      - 'scripts/verify_jobs.py'
      - 'scripts/merge_recovery_snapshot.py'
      - 'scripts/update_collection_state.py'
      - 'scripts/harden_complete_crawler.py'
      - 'scripts/harden_network_retries.py'
      - 'scripts/hotfix_support_office.py'
      - 'scripts/hotfix_repair_links.py'
      - 'scripts/hotfix_sources.py'
      - 'sources.json'
      - '.github/workflows/update-jobs.yml'
  schedule:
    - cron: '17 */2 * * *' # 2시간마다. 긴 검증 실행을 매시간 겹치게 하지 않는다.

permissions:
  contents: write

concurrency:
  group: metro-edujob-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 105
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install collector dependencies
        run: pip install requests beautifulsoup4

      - name: Preserve newest valid published baseline
        shell: bash
        run: |
          set -euo pipefail
          is_valid_jobs() {
            python - "$1" <<'PY'
          import json, sys
          from pathlib import Path
          try:
              d=json.loads(Path(sys.argv[1]).read_text(encoding='utf-8'))
              jobs=d.get('jobs',[]) if isinstance(d,dict) else []
              ok=len(jobs)>=100
          except Exception:
              ok=False
          raise SystemExit(0 if ok else 1)
          PY
          }
          if is_valid_jobs jobs.json; then
            cp jobs.json /tmp/jobs_previous.json
          else
            found=''
            while read -r commit; do
              if git show "${commit}:jobs.json" >/tmp/jobs_candidate.json 2>/dev/null && is_valid_jobs /tmp/jobs_candidate.json; then
                cp /tmp/jobs_candidate.json /tmp/jobs_previous.json
                found="$commit"; break
              fi
            done < <(git rev-list HEAD -- jobs.json)
            [ -n "$found" ] || { echo 'No valid historical jobs baseline' >&2; exit 1; }
            cp /tmp/jobs_previous.json jobs.json
          fi

      - name: Prepare resilient collectors without inflating fast page caps
        run: |
          python scripts/hotfix_sources.py
          python scripts/hotfix_support_office.py
          python scripts/hotfix_repair_links.py
          python scripts/harden_complete_crawler.py
          python scripts/harden_network_retries.py
          python -m py_compile scripts/scrape_jobs.py scripts/repair_gyeonggi_support.py scripts/complete_support_coverage.py scripts/resolve_support_links.py scripts/enrich_support_periods.py scripts/enrich_seoul_get_fallback.py scripts/verify_support_completeness.py scripts/verify_jobs.py scripts/merge_recovery_snapshot.py scripts/update_collection_state.py
          grep -q 'MAX_PAGES = 500' scripts/complete_support_coverage.py
          grep -q 'RETRY_POLICY = Retry' scripts/scrape_jobs.py

      - name: Collect central portals and current support-office pages
        run: python scripts/scrape_jobs.py

      - name: Re-check Gyeonggi support-office boards
        run: python scripts/repair_gyeonggi_support.py

      - name: Traverse all 25+11 support offices through the recent 90-day boundary
        run: python scripts/complete_support_coverage.py

      - name: Preserve active postings that disappeared only in this crawl
        run: python scripts/merge_recovery_snapshot.py --previous /tmp/jobs_previous.json --report missing_recovery_report.json

      - name: Resolve exact detail links and enrich application/hiring periods
        run: |
          python scripts/resolve_support_links.py
          python scripts/enrich_support_periods.py
          python scripts/enrich_seoul_get_fallback.py

      - name: Require proven 25+11 support-office coverage
        run: |
          if ! python scripts/verify_support_completeness.py; then
            cp /tmp/jobs_previous.json jobs.json
            echo 'Coverage proof failed; kept previous publication.' >&2
            exit 1
          fi

      - name: Independent publication verification
        run: |
          if ! python scripts/verify_jobs.py --previous /tmp/jobs_previous.json; then
            cp /tmp/jobs_previous.json jobs.json
            echo 'Independent validation failed; kept previous publication.' >&2
            exit 1
          fi

      - name: Persist append-only recruitment ledger and checkpoints
        run: python scripts/update_collection_state.py

      - name: Final publication guard
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('jobs.json').read_text(encoding='utf-8'))
          jobs=d.get('jobs',[]) if isinstance(d,dict) else []
          if len(jobs)<100: raise SystemExit(f'Refusing publication: only {len(jobs)} jobs')
          print(f'Publication guard passed: {len(jobs)} jobs')
          PY

      - name: Commit only verified collection state
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add jobs.json job_ledger.json collection_state.json board_cache.json missing_recovery_report.json support_coverage_report.json support_link_resolution.json support_period_cache.json sources.json scripts/scrape_jobs.py scripts/repair_gyeonggi_support.py scripts/complete_support_coverage.py scripts/resolve_support_links.py scripts/enrich_support_periods.py scripts/enrich_seoul_get_fallback.py
          git diff --cached --quiet && exit 0
          git commit -m 'Refresh verified recruitment jobs with durable collection memory'
          git pull --rebase
          git push
