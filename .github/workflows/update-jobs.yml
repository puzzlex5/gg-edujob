name: Update 수도권 education jobs

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/scrape_jobs.py'
      - 'scripts/repair_gyeonggi_support.py'
      - 'scripts/resolve_support_links.py'
      - 'scripts/enrich_support_periods.py'
      - 'scripts/enrich_seoul_get_fallback.py'
      - 'scripts/verify_jobs.py'
      - 'scripts/merge_recovery_snapshot.py'
      - 'scripts/update_collection_state.py'
      - 'scripts/update_collector_status.py'
      - 'scripts/sanitize_job_dates.py'
      - 'scripts/harden_fast_pagination.py'
      - 'scripts/harden_network_retries.py'
      - 'scripts/hotfix_repair_links.py'
      - 'scripts/hotfix_sources.py'
      - 'sources.json'
      - '.github/workflows/update-jobs.yml'
  schedule:
    - cron: '17 */2 * * *' # 2시간마다 빠른 신규/변경 공고 수집

permissions:
  contents: write

concurrency:
  group: metro-edujob-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install collector dependencies
        run: pip install requests beautifulsoup4
      - name: Mark fast refresh start
        run: python scripts/update_collector_status.py --workflow fast --stage baseline --state running

      - name: Preserve newest valid published baseline
        shell: bash
        run: |
          set -euo pipefail
          is_valid_jobs() {
            python - "$1" <<'PY'
          import json, sys
          from pathlib import Path
          try:
              d=json.loads(Path(sys.argv[1]).read_text(encoding='utf-8'))
              jobs=d.get('jobs',[]) if isinstance(d,dict) else []
              ok=len(jobs)>=100
          except Exception:
              ok=False
          raise SystemExit(0 if ok else 1)
          PY
          }
          if is_valid_jobs jobs.json; then
            cp jobs.json /tmp/jobs_previous.json
          else
            found=''
            while read -r commit; do
              if git show "${commit}:jobs.json" >/tmp/jobs_candidate.json 2>/dev/null && is_valid_jobs /tmp/jobs_candidate.json; then
                cp /tmp/jobs_candidate.json /tmp/jobs_previous.json
                found="$commit"; break
              fi
            done < <(git rev-list HEAD -- jobs.json)
            [ -n "$found" ] || { echo 'No valid historical jobs baseline' >&2; exit 1; }
            cp /tmp/jobs_previous.json jobs.json
          fi

      - name: Prepare resilient fast collectors
        run: |
          python scripts/update_collector_status.py --workflow fast --stage hardening --state running
          python scripts/hotfix_sources.py
          python scripts/hotfix_repair_links.py
          python scripts/harden_fast_pagination.py
          python scripts/harden_network_retries.py
          python -m py_compile scripts/scrape_jobs.py scripts/repair_gyeonggi_support.py scripts/resolve_support_links.py scripts/enrich_support_periods.py scripts/enrich_seoul_get_fallback.py scripts/verify_jobs.py scripts/merge_recovery_snapshot.py scripts/update_collection_state.py scripts/update_collector_status.py scripts/sanitize_job_dates.py
          grep -q 'FAST_MAX_PAGES = 60' scripts/scrape_jobs.py
          grep -q 'RETRY_POLICY = Retry' scripts/scrape_jobs.py

      - name: Fast crawl of central portals and support-office current pages
        run: |
          python scripts/update_collector_status.py --workflow fast --stage fast-crawl --state running
          python scripts/scrape_jobs.py

      - name: Fast re-check of Gyeonggi support-office boards
        run: |
          python scripts/update_collector_status.py --workflow fast --stage gyeonggi-recheck --state running
          python scripts/repair_gyeonggi_support.py

      - name: Sanitize impossible registration dates
        run: python scripts/sanitize_job_dates.py

      - name: Preserve active postings missing only from this fast crawl
        run: |
          python scripts/update_collector_status.py --workflow fast --stage baseline-merge --state running
          python scripts/merge_recovery_snapshot.py --previous /tmp/jobs_previous.json --report missing_recovery_report.json

      - name: Resolve exact detail links and enrich application/hiring periods
        run: |
          python scripts/update_collector_status.py --workflow fast --stage detail-enrichment --state running
          python scripts/resolve_support_links.py
          python scripts/enrich_support_periods.py
          python scripts/enrich_seoul_get_fallback.py

      - name: Independent fast-publication verification
        run: |
          python scripts/update_collector_status.py --workflow fast --stage verification --state running
          if ! python scripts/verify_jobs.py --previous /tmp/jobs_previous.json; then
            cp /tmp/jobs_previous.json jobs.json
            echo 'Fast refresh validation failed; kept previous publication.' >&2
            exit 1
          fi

      - name: Persist append-only recruitment ledger and checkpoints
        run: |
          python scripts/update_collector_status.py --workflow fast --stage ledger --state running
          python scripts/update_collection_state.py

      - name: Final publication guard
        run: |
          python scripts/update_collector_status.py --workflow fast --stage publication-guard --state running
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('jobs.json').read_text(encoding='utf-8'))
          jobs=d.get('jobs',[]) if isinstance(d,dict) else []
          if len(jobs)<100: raise SystemExit(f'Refusing publication: only {len(jobs)} jobs')
          print(f'Fast publication guard passed: {len(jobs)} jobs')
          PY
          python scripts/update_collector_status.py --workflow fast --stage complete --state success

      - name: Commit only verified fast refresh state
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add collector_status.json jobs.json job_ledger.json collection_state.json board_cache.json missing_recovery_report.json date_anomaly_report.json support_link_resolution.json support_period_cache.json sources.json scripts/scrape_jobs.py scripts/repair_gyeonggi_support.py scripts/resolve_support_links.py scripts/enrich_support_periods.py scripts/enrich_seoul_get_fallback.py
          git diff --cached --quiet && exit 0
          git commit -m 'Fast refresh verified recruitment postings'
          # Runtime hardeners can leave intentionally uncommitted working-tree edits. They must
          # not make git pull --rebase fail after a fully verified publication commit exists.
          git reset --hard HEAD
          git pull --rebase
          git push

      - name: Record fast refresh failure without publishing dirty data
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          # If every validation step completed and HEAD itself already contains the verified
          # success snapshot, first recover from a sync-only failure instead of rewriting that
          # proven success as a collector failure.
          head_success="$(git show HEAD:collector_status.json 2>/dev/null | python -c "import json,sys; e=json.load(sys.stdin).get('fast',{}); print(e.get('lastSuccessAt','') if e.get('state')=='success' and e.get('stage')=='complete' else '')" 2>/dev/null || true)"
          if [ -n "$head_success" ] && [ "$(git log -1 --pretty=%s)" = 'Fast refresh verified recruitment postings' ]; then
            echo 'Verified success commit exists locally; cleaning runtime edits and retrying sync.'
            git reset --hard HEAD
            if git pull --rebase && git push; then
              echo 'Recovered verified publication sync without false failure status.'
              exit 0
            fi
          fi

          # A verified publication may already have reached origin/main even if a later command
          # returned non-zero. Preserve it when the success token on origin matches this run.
          git fetch origin main
          local_success="$(python - <<'PY'
          import json
          from pathlib import Path
          try:
              e=json.loads(Path('collector_status.json').read_text(encoding='utf-8')).get('fast',{})
              print(e.get('lastSuccessAt','') if e.get('state')=='success' and e.get('stage')=='complete' else '')
          except Exception:
              print('')
          PY
          )"
          origin_success="$(git show origin/main:collector_status.json 2>/dev/null | python -c "import json,sys; e=json.load(sys.stdin).get('fast',{}); print(e.get('lastSuccessAt','') if e.get('state')=='success' and e.get('stage')=='complete' else '')" 2>/dev/null || true)"
          if [ -n "$local_success" ] && [ "$local_success" = "$origin_success" ]; then
            echo 'Verified publication already exists on origin/main; preserving success status.'
            exit 0
          fi

          python scripts/update_collector_status.py --workflow fast --state failed
          cp collector_status.json /tmp/collector_status.json
          git reset --hard HEAD
          cp /tmp/collector_status.json collector_status.json
          git add collector_status.json
          git diff --cached --quiet && exit 0
          git commit -m 'Record fast collector failure stage'
          git reset --hard HEAD
          git pull --rebase
          git push
