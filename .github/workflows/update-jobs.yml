name: Update 수도권 education jobs

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/scrape_jobs.py'
      - 'sources.json'
      - '.github/workflows/update-jobs.yml'
  schedule:
    - cron: '5 22 * * *' # 07:05 KST

permissions:
  contents: write

concurrency:
  group: metro-edujob-data
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install collector dependencies
        run: pip install requests beautifulsoup4
      - name: Collect Seoul and Gyeonggi education recruitment data
        run: python scripts/scrape_jobs.py
      - name: Commit updated jobs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add jobs.json
          git diff --cached --quiet && exit 0
          git commit -m 'Update metropolitan recruitment data'
          git pull --rebase
          git push
