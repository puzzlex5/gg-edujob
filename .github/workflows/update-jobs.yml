name: Update 수도권 education jobs

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/scrape_jobs.py'
      - 'scripts/repair_gyeonggi_support.py'
      - 'scripts/resolve_support_links.py'
      - 'scripts/verify_jobs.py'
      - 'scripts/hotfix_support_office.py'
      - 'scripts/hotfix_repair_links.py'
      - 'scripts/hotfix_sources.py'
      - 'scripts/diagnose_support_links.py'
      - 'sources.json'
      - '.github/workflows/update-jobs.yml'
  schedule:
    - cron: '5 22 * * *' # 07:05 KST - 1차 수집/검증
    - cron: '5 23 * * *' # 08:05 KST - 2차 재수집/재검증

permissions:
  contents: write

concurrency:
  group: metro-edujob-data
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history is required so an accidentally empty/corrupt jobs.json can
          # be recovered from the newest valid published snapshot.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install collector dependencies
        run: pip install requests beautifulsoup4
      - name: Preserve newest valid published data for anomaly comparison and rollback
        shell: bash
        run: |
          set -euo pipefail
          is_valid_jobs() {
            python - "$1" <<'PY'
          import json, sys
          from pathlib import Path
          p = Path(sys.argv[1])
          try:
              data = json.loads(p.read_text(encoding='utf-8'))
              jobs = data.get('jobs', []) if isinstance(data, dict) else []
              ok = len(jobs) >= 100
          except Exception:
              ok = False
          raise SystemExit(0 if ok else 1)
          PY
          }

          if is_valid_jobs jobs.json; then
            cp jobs.json /tmp/jobs_previous.json
            echo 'Current jobs.json is a valid rollback snapshot.'
          else
            echo 'Current jobs.json is empty/corrupt; searching Git history for the newest valid snapshot.'
            found=''
            while read -r commit; do
              [ -n "$commit" ] || continue
              if git show "${commit}:jobs.json" > /tmp/jobs_candidate.json 2>/dev/null && is_valid_jobs /tmp/jobs_candidate.json; then
                cp /tmp/jobs_candidate.json /tmp/jobs_previous.json
                found="$commit"
                echo "Recovered valid jobs.json snapshot from $commit"
                break
              fi
            done < <(git rev-list HEAD -- jobs.json)

            if [ -z "$found" ]; then
              echo 'No valid historical jobs.json snapshot exists; refusing to risk publishing an empty dataset.' >&2
              exit 1
            fi

            # Restore the valid snapshot in the worktree immediately. Fresh collection
            # may replace it only after independent verification passes.
            cp /tmp/jobs_previous.json jobs.json
          fi
      - name: Apply targeted official-source board fixes
        run: python scripts/hotfix_sources.py
      - name: Diagnose exact support-office detail-link structures
        run: python scripts/diagnose_support_links.py
      - name: Save source fixes and link diagnostics for repair analysis
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sources.json support_link_diagnostics.json
          if ! git diff --cached --quiet; then
            git commit -m 'Record source and support-link diagnostics'
            git pull --rebase
            git push
          fi
      - name: Apply support-office parser and exact-link compatibility fixes
        run: |
          python scripts/hotfix_support_office.py
          python scripts/hotfix_repair_links.py
          python -m py_compile scripts/scrape_jobs.py scripts/repair_gyeonggi_support.py scripts/resolve_support_links.py
          grep -q 'detailLinkResolved' index.html
          grep -q 'subject_parts=' scripts/scrape_jobs.py
          grep -q 'data_id = clean(str(a.get("data-id", "")))' scripts/scrape_jobs.py
          grep -q 'data_id = clean(str(a.get("data-id", "")))' scripts/repair_gyeonggi_support.py
      - name: Collect central and all support-office recruitment boards
        run: python scripts/scrape_jobs.py
      - name: Repair and re-check all 25 Gyeonggi support-office boards
        run: python scripts/repair_gyeonggi_support.py
      - name: Resolve exact individual support-office posting links
        run: python scripts/resolve_support_links.py
      - name: Independent second-pass verification
        run: |
          if ! python scripts/verify_jobs.py --previous /tmp/jobs_previous.json; then
            echo 'Critical validation failure. Restoring the newest known-good jobs.json.'
            cp /tmp/jobs_previous.json jobs.json
            exit 1
          fi
      - name: Final guard against empty/corrupt publication
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('jobs.json')
          data = json.loads(p.read_text(encoding='utf-8'))
          jobs = data.get('jobs', []) if isinstance(data, dict) else []
          if len(jobs) < 100:
              raise SystemExit(f'Refusing publication: only {len(jobs)} jobs in jobs.json')
          print(f'Publication guard passed: {len(jobs)} jobs')
          PY
      - name: Commit verified jobs, exact-link report, and corrected collectors
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add jobs.json board_cache.json index.html scripts/scrape_jobs.py scripts/repair_gyeonggi_support.py support_link_resolution.json sources.json
          git diff --cached --quiet && exit 0
          git commit -m 'Refresh verified jobs with exact support-office links'
          git pull --rebase
          git push

# retrigger: recover valid published data and refresh exact support-office details
