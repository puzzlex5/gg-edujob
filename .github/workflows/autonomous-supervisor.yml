name: Autonomous stage-5 supervisor

on:
  workflow_dispatch:
  schedule:
    - cron: '7 * * * *'

permissions:
  contents: write
  actions: write

concurrency:
  group: metro-edujob-autonomous-supervisor
  cancel-in-progress: true

jobs:
  supervise:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Unit-test supervisor policy
        run: python -m unittest tests/test_autonomous_supervisor.py

      - name: Prepare authoritative deep-audit evidence
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          src = Path('deep_audit_status.json')
          dst = Path('deep_audit_status.supervisor.json')
          deep = json.loads(src.read_text(encoding='utf-8')) if src.exists() else {}
          evidence = deep.get('effectiveEvidence') or {}
          proof = deep.get('effectiveProof') or ''
          reconciled = int(evidence.get('reconciledSources') or 0)
          total = int(evidence.get('totalSources') or 0)
          authoritative_complete = (
              proof == '38-source-reconciliation'
              and evidence.get('currentComplete') is True
              and total > 0
              and reconciled == total
              and int(evidence.get('missingAfter') or 0) == 0
              and int(evidence.get('missingOfficialIdsFromCurrentDataset') or 0) == 0
              and evidence.get('centralPaginationComplete') is True
          )
          if authoritative_complete:
              evidence['supportCoverageCurrentComplete'] = True
              deep['effectiveEvidence'] = evidence
          dst.write_text(json.dumps(deep, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Build one-action repair plan
        run: python scripts/autonomous_supervisor.py plan --deep deep_audit_status.supervisor.json --state agent_status.json --output agent_plan.json

      - name: Publish plan to workflow summary
        shell: bash
        run: |
          echo '## 수도권에듀잡 autonomous supervisor' >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat agent_plan.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Select repair workflow
        id: select
        shell: bash
        run: |
          workflow="$(python - <<'PY'
          import json
          p=json.load(open('agent_plan.json',encoding='utf-8'))
          a=p.get('selectedAction') or {}
          print(a.get('workflow',''))
          PY
          )"
          reason="$(python - <<'PY'
          import json
          p=json.load(open('agent_plan.json',encoding='utf-8'))
          a=p.get('selectedAction') or {}
          print((a.get('reason') or '').replace('\n',' '))
          PY
          )"
          echo "workflow=$workflow" >> "$GITHUB_OUTPUT"
          echo "reason=$reason" >> "$GITHUB_OUTPUT"

      - name: Check selected workflow activity
        if: steps.select.outputs.workflow != ''
        id: activity
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_WORKFLOW: ${{ steps.select.outputs.workflow }}
        run: |
          set -euo pipefail
          target_active="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/workflows/${TARGET_WORKFLOW}/runs?per_page=50" \
            --jq '[.workflow_runs[] | select(.status=="queued" or .status=="in_progress" or .status=="waiting" or .status=="requested" or .status=="pending")] | length')"

          shared_data_active=0
          case "$TARGET_WORKFLOW" in
            update-jobs.yml|daily-deep-audit.yml|recover-missing-jobs.yml|restore-official-ids.yml)
              shared_data_active="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs?per_page=100" \
                --jq '[.workflow_runs[] | select((.status=="queued" or .status=="in_progress" or .status=="waiting" or .status=="requested" or .status=="pending") and (.path==".github/workflows/update-jobs.yml" or .path==".github/workflows/daily-deep-audit.yml" or .path==".github/workflows/recover-missing-jobs.yml" or .path==".github/workflows/restore-official-ids.yml"))] | length')"
              ;;
          esac

          if [ "${target_active:-0}" -gt 0 ] || [ "${shared_data_active:-0}" -gt 0 ]; then
            echo 'active=true' >> "$GITHUB_OUTPUT"
            echo "Suppressing duplicate dispatch: target_active=${target_active:-0}, shared_data_active=${shared_data_active:-0}."
          else
            echo 'active=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Dispatch selected repair workflow
        if: steps.select.outputs.workflow != '' && steps.activity.outputs.active != 'true'
        id: dispatch
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_WORKFLOW: ${{ steps.select.outputs.workflow }}
        shell: bash
        run: gh workflow run "$TARGET_WORKFLOW" --ref main

      - name: Record autonomous decision
        if: steps.select.outputs.workflow != '' && steps.activity.outputs.active != 'true'
        shell: bash
        env:
          TARGET_WORKFLOW: ${{ steps.select.outputs.workflow }}
          DISPATCH_OUTCOME: ${{ steps.dispatch.outcome }}
          DECISION_REASON: ${{ steps.select.outputs.reason }}
        run: |
          if [ "$DISPATCH_OUTCOME" = 'success' ]; then result='dispatched'; else result='failed'; fi
          python scripts/autonomous_supervisor.py record \
            --state agent_status.json \
            --plan agent_plan.json \
            --workflow "$TARGET_WORKFLOW" \
            --result "$result" \
            --message "$DECISION_REASON"

      - name: Commit supervisor state only when it acted
        if: steps.select.outputs.workflow != '' && steps.activity.outputs.active != 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add agent_status.json
          git diff --cached --quiet && exit 0
          git commit -m 'Record autonomous supervisor repair decision'
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Fail visibly when dispatch failed
        if: steps.select.outputs.workflow != '' && steps.activity.outputs.active != 'true' && steps.dispatch.outcome != 'success'
        run: exit 1
