name: Cultural foundation coverage

on:
  workflow_dispatch:
  schedule:
    - cron: '25 22 * 1-12 *'
  push:
    branches: [main]
    paths:
      - 'cultural_foundation_registry.json'
      - 'verified_foundation_official_sources.json'
      - 'scripts/validate_cultural_foundation_registry.py'
      - 'scripts/crawl_official_foundation_jobs_v2.py'
      - 'scripts/probe_cultural_sources.py'
      - 'scripts/probe_cleaneye_api.py'
      - 'scripts/crawl_cleaneye_foundation_jobs.py'
      - 'scripts/crawl_ancf_foundation_jobs.py'
      - 'scripts/audit_artmore_foundations.py'
      - 'scripts/discover_foundation_official_sources.py'
      - '.github/workflows/cultural-foundation-coverage.yml'

permissions:
  contents: write

concurrency:
  group: cultural-foundation-coverage
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Syntax check production foundation crawler
        run: python -m py_compile scripts/crawl_official_foundation_jobs_v2.py
      - name: Validate foundation registry
        run: python scripts/validate_cultural_foundation_registry.py
      - name: Collect official cultural-foundation jobs (single production writer)
        run: python scripts/crawl_official_foundation_jobs_v2.py
      - name: Require v6 SFAC adapter report before any report commit
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('official_foundation_report.json')
          d=json.loads(p.read_text(encoding='utf-8'))
          assert d.get('policy') == 'official-foundation-primary-fail-closed-v6-sfac-saramin-careerlink', d.get('policy')
          unsupported=d.get('unsupportedConfiguredBoards') or []
          assert not any(x.get('reason') == 'adapter-not-yet-implemented' for x in unsupported), unsupported
          print('v6 foundation report verified', d.get('jobs'), d.get('policy'))
          PY
      - name: Probe CleanEye and ANCF surfaces
        run: python scripts/probe_cultural_sources.py
      - name: Probe CleanEye recruitment API
        run: python scripts/probe_cleaneye_api.py
      - name: Collect current CleanEye foundation jobs
        run: python scripts/crawl_cleaneye_foundation_jobs.py
      - name: Collect ANCF foundation cross-check jobs
        run: python scripts/crawl_ancf_foundation_jobs.py
      - name: Audit ArtMore against foundation registry
        run: python scripts/audit_artmore_foundations.py
      - name: Discover verified official source candidates
        run: python scripts/discover_foundation_official_sources.py
      - name: Commit audit datasets and reports (foundation report is owned here only)
        run: |
          set -e
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add official_foundation_jobs.json official_foundation_report.json cultural_foundation_registry_report.json cultural_source_probe_report.json cleaneye_api_probe_report.json cleaneye_foundation_jobs.json cleaneye_foundation_report.json ancf_foundation_jobs.json ancf_foundation_report.json artmore_foundation_crosscheck.json artmore_foundation_crosscheck_report.json foundation_official_source_candidates.json foundation_official_source_discovery_report.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Audit cultural foundation source surfaces'
          for i in 1 2 3; do
            git fetch origin main
            git reset --mixed origin/main
            git add official_foundation_jobs.json official_foundation_report.json cultural_foundation_registry_report.json cultural_source_probe_report.json cleaneye_api_probe_report.json cleaneye_foundation_jobs.json cleaneye_foundation_report.json ancf_foundation_jobs.json ancf_foundation_report.json artmore_foundation_crosscheck.json artmore_foundation_crosscheck_report.json foundation_official_source_candidates.json foundation_official_source_discovery_report.json
            git diff --cached --quiet || git commit -m 'Audit cultural foundation source surfaces'
            if git push origin HEAD:main; then exit 0; fi
            sleep $((i*5))
          done
          exit 1
# Trigger-only comment: rerun production foundation writer after single-writer hardening.
