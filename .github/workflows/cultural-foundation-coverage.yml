name: Cultural foundation coverage

on:
  workflow_dispatch:
  push:
    branches: [main, gpt/cultural-foundation-coverage-v2]
    paths:
      - 'cultural_foundation_registry.json'
      - 'cultural_foundation_routes.json'
      - 'scripts/cultural_foundation_common.py'
      - 'scripts/validate_cultural_foundation_registry.py'
      - 'scripts/validate_cultural_foundation_routes.py'
      - 'scripts/probe_cultural_sources.py'
      - 'scripts/probe_cleaneye_runtime.py'
      - 'scripts/crawl_ancf_foundation_jobs.py'
      - '.github/workflows/cultural-foundation-coverage.yml'

permissions:
  contents: write

concurrency:
  group: cultural-foundation-coverage-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt playwright
          python -m playwright install --with-deps chromium
      - name: Validate foundation identity registry
        run: python scripts/validate_cultural_foundation_registry.py
      - name: Validate operational foundation routes
        run: python scripts/validate_cultural_foundation_routes.py
      - name: Probe CleanEye and ANCF surfaces
        run: python scripts/probe_cultural_sources.py
      - name: Probe CleanEye institution search in Chromium
        run: python scripts/probe_cleaneye_runtime.py
      - name: Collect ANCF foundation cross-check jobs
        run: python scripts/crawl_ancf_foundation_jobs.py
      - name: Commit audit datasets and reports
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cultural_foundation_registry_report.json cultural_foundation_routes_report.json cultural_source_probe_report.json cleaneye_runtime_probe.json ancf_foundation_jobs.json ancf_foundation_report.json
          if ! git diff --cached --quiet; then
            git commit -m 'Audit cultural foundation source surfaces'
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin HEAD:"${GITHUB_REF_NAME}"
          fi
