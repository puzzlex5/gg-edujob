name: Cultural foundation coverage

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'cultural_foundation_registry.json'
      - 'scripts/validate_cultural_foundation_registry.py'
      - 'scripts/probe_cultural_sources.py'
      - '.github/workflows/cultural-foundation-coverage.yml'

permissions:
  contents: write

concurrency:
  group: cultural-foundation-coverage
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Validate foundation registry
        run: python scripts/validate_cultural_foundation_registry.py
      - name: Probe CleanEye and ANCF surfaces
        run: python scripts/probe_cultural_sources.py
      - name: Commit audit reports
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cultural_foundation_registry_report.json cultural_source_probe_report.json
          if ! git diff --cached --quiet; then
            git commit -m 'Audit cultural foundation source surfaces'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
