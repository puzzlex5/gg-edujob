name: Hotfix support-office clicks

on:
  push:
    paths:
      - '.github/workflows/hotfix-support-office-clicks.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  hotfix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply stable support-office hotfix
        run: |
          python scripts/hotfix_support_office.py
          python -m py_compile scripts/scrape_jobs.py
          grep -q "data_id = clean(str(a.get(\"data-id\", \"\")))" scripts/scrape_jobs.py
          grep -q 'subject_parts=' scripts/scrape_jobs.py
          grep -q 'return detail.href;' index.html
          grep -q "return '';" index.html
      - name: Commit immediate hotfix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html scripts/scrape_jobs.py
          git diff --cached --quiet && exit 0
          git commit -m 'Restore exact support-office detail links'
          git pull --rebase
          git push

