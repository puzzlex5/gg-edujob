name: Update Lessoninfo recruitment jobs

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/crawl_lessoninfo_jobs.py'
      - 'scripts/run_lessoninfo_jobs_exact.py'
      - '.github/workflows/update-lessoninfo-jobs.yml'
  schedule:
    - cron: '27 * * * *'

permissions:
  contents: write

concurrency:
  group: metro-edujob-lessoninfo
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync latest main
        run: |
          git fetch origin main
          git reset --hard origin/main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install collector dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Syntax check
        run: python -m py_compile scripts/crawl_lessoninfo_jobs.py scripts/run_lessoninfo_jobs_exact.py

      - name: Collect exact Lessoninfo recruitment surfaces
        id: collect
        continue-on-error: true
        env:
          LESSONINFO_LOOKBACK_DAYS: '120'
          LESSONINFO_MAX_PAGES: '500'
          LESSONINFO_DELAY_SECONDS: '0.8'
        run: python scripts/run_lessoninfo_jobs_exact.py

      - name: Validate reconciliation evidence
        id: validate
        continue-on-error: true
        run: |
          python - <<'PY'
          import json, pathlib
          p = pathlib.Path('lessoninfo_reconciliation_report.json')
          if not p.exists():
              raise SystemExit('missing reconciliation report')
          r = json.loads(p.read_text(encoding='utf-8'))
          print(json.dumps({
              'policy': r.get('policy'),
              'healthy': r.get('healthy'),
              'traversalComplete': r.get('traversalComplete'),
              'sourceReports': r.get('sourceReports'),
              'discoveredIdCount': r.get('discoveredIdCount'),
              'publishedIdCount': r.get('publishedIdCount'),
              'missingAfterCount': r.get('missingAfterCount'),
              'detailErrorCount': r.get('detailErrorCount'),
              'preservedPreviousDataset': r.get('preservedPreviousDataset'),
          }, ensure_ascii=False, indent=2))
          if r.get('policy') != 'lessoninfo-exact-two-surface-v4':
              raise SystemExit('wrong Lessoninfo collection policy')
          if not r.get('healthy') or not r.get('traversalComplete') or r.get('missingAfterCount') != 0:
              raise SystemExit('Lessoninfo completeness guard failed')
          reports = r.get('sourceReports') or []
          surfaces = {x.get('surface') for x in reports}
          if not {'방과후/강사 구인', '문화예술구인'}.issubset(surfaces):
              raise SystemExit('both Lessoninfo recruitment surfaces were not verified')
          PY

      - name: Commit collection evidence and healthy dataset
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lessoninfo_jobs.json lessoninfo_source_id_ledger.json lessoninfo_reconciliation_report.json lessoninfo_collection_state.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m 'Update Lessoninfo recruitment collection evidence'
            for i in 1 2 3; do
              git pull --rebase origin main && git push origin HEAD:main && break
              sleep $((i*5))
            done
          fi

      - name: Fail after preserving diagnostics
        if: steps.collect.outcome != 'success' || steps.validate.outcome != 'success'
        run: exit 1
