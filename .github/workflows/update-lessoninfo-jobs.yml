name: Update Lessoninfo recruitment jobs

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/crawl_lessoninfo_jobs.py'
      - 'scripts/run_lessoninfo_jobs_exact.py'
      - 'scripts/crawl_lessoninfo_browser.py'
      - 'scripts/run_lessoninfo_browser_fast.py'
      - '.github/workflows/update-lessoninfo-jobs.yml'
  schedule:
    - cron: '27 * * * *'

permissions:
  contents: write

concurrency:
  group: metro-edujob-lessoninfo
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync latest main
        run: |
          git fetch origin main
          git reset --hard origin/main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install collector dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt playwright
          python -m playwright install --with-deps chromium

      - name: Syntax check
        run: python -m py_compile scripts/crawl_lessoninfo_jobs.py scripts/crawl_lessoninfo_browser.py scripts/run_lessoninfo_browser_fast.py

      - name: Collect current Lessoninfo jobs in Chromium
        id: collect
        continue-on-error: true
        env:
          LESSONINFO_BROWSER_MAX_PAGES: '35'
          LESSONINFO_BROWSER_DISCOVERY_DAYS: '120'
          LESSONINFO_BROWSER_DETAIL_CONCURRENCY: '4'
          LESSONINFO_NO_DEADLINE_FRESH_DAYS: '30'
        run: python scripts/run_lessoninfo_browser_fast.py

      - name: Validate current-only collection evidence
        id: validate
        continue-on-error: true
        run: |
          python - <<'PY'
          import json, pathlib
          p = pathlib.Path('lessoninfo_reconciliation_report.json')
          if not p.exists():
              raise SystemExit('missing reconciliation report')
          r = json.loads(p.read_text(encoding='utf-8'))
          print(json.dumps({
              'policy': r.get('policy'),
              'healthy': r.get('healthy'),
              'traversalComplete': r.get('traversalComplete'),
              'sourceReports': r.get('sourceReports'),
              'candidateIdCount': r.get('candidateIdCount'),
              'activeIdCount': r.get('activeIdCount'),
              'publishedIdCount': r.get('publishedIdCount'),
              'perSurfaceActive': r.get('perSurfaceActive'),
              'missingAfterCount': r.get('missingAfterCount'),
              'detailErrorCount': r.get('detailErrorCount'),
              'classificationCounts': r.get('classificationCounts'),
              'preservedPreviousDataset': r.get('preservedPreviousDataset'),
          }, ensure_ascii=False, indent=2))
          if r.get('policy') != 'lessoninfo-active-browser-v1':
              raise SystemExit('wrong Lessoninfo browser collection policy')
          if not r.get('healthy') or not r.get('traversalComplete') or r.get('missingAfterCount') != 0:
              raise SystemExit('Lessoninfo completeness guard failed')
          reports = r.get('sourceReports') or []
          surfaces = {x.get('surface') for x in reports}
          if not {'방과후교사•늘봄학교 강사', '문화예술 채용'}.issubset(surfaces):
              raise SystemExit('both requested Lessoninfo recruitment surfaces were not verified')
          if len(reports) != 2 or any((x.get('ids') or 0) <= 0 for x in reports):
              raise SystemExit('a Lessoninfo source surface returned zero source IDs')
          if r.get('detailErrorCount') != 0:
              raise SystemExit('one or more Lessoninfo detail postings could not be verified')

          jp = pathlib.Path('lessoninfo_jobs.json')
          if not jp.exists():
              raise SystemExit('missing Lessoninfo published dataset')
          d = json.loads(jp.read_text(encoding='utf-8'))
          jobs = d if isinstance(d, list) else (d.get('jobs') or [])
          bad = [
              {
                  'id': j.get('sourceIdentity'),
                  'title': j.get('title'),
                  'metroRegion': j.get('metroRegion'),
                  'location': j.get('location'),
              }
              for j in jobs
              if j.get('metroRegion') not in {'서울', '경기'}
          ]
          if bad:
              print(json.dumps(bad[:20], ensure_ascii=False, indent=2))
              raise SystemExit(f'non-Seoul/Gyeonggi Lessoninfo rows published: {len(bad)}')
          print(f'Lessoninfo metro-only guard passed: {len(jobs)} Seoul/Gyeonggi jobs')
          PY

      - name: Commit collection evidence and healthy dataset
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lessoninfo_jobs.json lessoninfo_source_id_ledger.json lessoninfo_reconciliation_report.json lessoninfo_collection_state.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m 'Update current Lessoninfo recruitment collection'
            for i in 1 2 3; do
              git pull --rebase origin main && git push origin HEAD:main && break
              sleep $((i*5))
            done
          fi

      - name: Fail after preserving diagnostics
        if: steps.collect.outcome != 'success' || steps.validate.outcome != 'success'
        run: exit 1
