name: Test graceful private-source isolation

on:
  push:
    branches:
      - 'fix/graceful-private-source-isolation'
    paths:
      - 'scripts/build_unified_search_multi.py'
      - 'scripts/validate_unified_search_multi.py'
      - '.github/workflows/test-graceful-private-isolation.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile changed pipeline
        run: python -m py_compile scripts/build_unified_search.py scripts/build_unified_search_multi.py scripts/validate_unified_search_multi.py
      - name: Build candidate with degraded-source isolation
        run: python scripts/build_unified_search_multi.py
      - name: Validate candidate
        run: python scripts/validate_unified_search_multi.py
      - name: Assert current degraded source is isolated and healthy sources survive
        run: |
          python - <<'PY'
          import json
          candidate=json.load(open('unified_jobs.next.json',encoding='utf-8'))
          report=json.load(open('unified_validation_report.json',encoding='utf-8'))
          private=candidate['privateSources']
          assert private['artmore']['degraded'] is True, private['artmore']
          assert private['artmore']['publicationEnabled'] is False, private['artmore']
          assert int(private['artmore']['count']) == 0, private['artmore']
          assert private['gonggonggangsa']['publicationEnabled'] is True, private['gonggonggangsa']
          assert private['gonggonggangsa']['ok'] is True, private['gonggonggangsa']
          assert int(private['gonggonggangsa']['count']) == 61, private['gonggonggangsa']
          assert 'artmore' in report.get('degradedPrivateSources',[]), report
          assert report.get('healthy') is True, report
          assert report.get('missingPrivateIds') == 0, report
          assert report.get('nonMetroPrivate') == 0, report
          assert report.get('expiredPrivate') == 0, report
          assert report.get('duplicateStableIds') == 0, report
          assert report.get('missingLinks') == 0, report
          print('graceful isolation verified', candidate['counts'], report['enabledPrivateSources'], report['degradedPrivateSources'])
          PY
