name: Install Seoul CMS cleanup into fast refresh

on:
  push:
    paths:
      - '.github/workflows/install-seoul-cms-fast-hook.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: metro-edujob-workflow-maintenance
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add conservative Seoul CMS recovery before verification
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/update-jobs.yml')
          s=p.read_text(encoding='utf-8')
          marker='''      - name: Independent fast-publication verification\n'''
          block='''      - name: Recover verified Seoul support-office CMS recruitment posts\n        run: |\n          python scripts/recover_seoul_office_cms_jobs.py\n          python scripts/sanitize_job_dates.py\n\n'''
          if block not in s:
              if marker not in s:
                  raise SystemExit('verification marker missing')
              s=s.replace(marker, block+marker, 1)
          add_line='          git add collector_status.json jobs.json job_ledger.json collection_state.json board_cache.json missing_recovery_report.json date_anomaly_report.json support_link_resolution.json support_period_cache.json sources.json scripts/scrape_jobs.py scripts/repair_gyeonggi_support.py scripts/resolve_support_links.py scripts/enrich_support_periods.py scripts/enrich_seoul_get_fallback.py\n'
          repl='          git add collector_status.json jobs.json job_ledger.json collection_state.json board_cache.json missing_recovery_report.json seoul_office_cms_recovery_report.json date_anomaly_report.json support_link_resolution.json support_period_cache.json sources.json scripts/scrape_jobs.py scripts/repair_gyeonggi_support.py scripts/resolve_support_links.py scripts/enrich_support_periods.py scripts/enrich_seoul_get_fallback.py\n'
          if repl not in s:
              if add_line not in s:
                  raise SystemExit('git add marker missing')
              s=s.replace(add_line,repl,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate workflow patch
        run: |
          grep -q 'Recover verified Seoul support-office CMS recruitment posts' .github/workflows/update-jobs.yml
          grep -q 'seoul_office_cms_recovery_report.json' .github/workflows/update-jobs.yml
      - name: Commit hook and remove installer
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '4189822+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/update-jobs.yml
          git rm .github/workflows/install-seoul-cms-fast-hook.yml
          git diff --cached --quiet && exit 0
          git commit -m 'Run Seoul CMS cleanup in every verified fast refresh'
          git pull --rebase
          git push
