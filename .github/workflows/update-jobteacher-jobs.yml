name: Update JobTeacher recruitment jobs

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/crawl_jobteacher_browser.py'
      - '.github/workflows/update-jobteacher-jobs.yml'
  schedule:
    - cron: '43 * * * *'

permissions:
  contents: write

concurrency:
  group: metro-edujob-jobteacher
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sync latest main
        run: |
          git fetch origin main
          git reset --hard origin/main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install collector dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt playwright
          python -m playwright install --with-deps chromium
      - name: Syntax check
        run: python -m py_compile scripts/crawl_jobteacher_browser.py
      - name: Collect isolated JobTeacher jobs
        id: collect
        continue-on-error: true
        run: python scripts/crawl_jobteacher_browser.py
      - name: Validate isolation and completeness gate
        id: validate
        continue-on-error: true
        run: |
          python - <<'PY'
          import json, pathlib
          r=json.loads(pathlib.Path('jobteacher_reconciliation_report.json').read_text(encoding='utf-8'))
          assert r.get('policy')=='jobteacher-active-browser-v1'
          assert r.get('publicationEnabled') is False
          assert r.get('healthy') is True
          assert r.get('traversalComplete') is True
          assert r.get('missingAfterCount')==0
          assert len(r.get('sourceReports') or [])==2
          assert all((x.get('ids') or 0)>0 and x.get('complete') for x in r['sourceReports'])
          jobs=json.loads(pathlib.Path('jobteacher_jobs.json').read_text(encoding='utf-8'))
          assert jobs and all(j.get('province') in {'서울','경기'} for j in jobs)
          assert all(str(j.get('sourceIdentity','')).startswith('jobteacher:') for j in jobs)
          print(json.dumps({'healthy':r['healthy'],'count':len(jobs),'sources':r['sourceReports']},ensure_ascii=False))
          PY
      - name: Commit isolated evidence and healthy dataset
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add jobteacher_jobs.json jobteacher_source_id_ledger.json jobteacher_reconciliation_report.json jobteacher_collection_state.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m 'Update isolated JobTeacher recruitment collection'
            for i in 1 2 3; do
              git pull --rebase origin main && git push origin HEAD:main && break
              sleep $((i*5))
            done
          fi
      - name: Fail after preserving diagnostics
        if: steps.collect.outcome != 'success' || steps.validate.outcome != 'success'
        run: exit 1
