name: Update JobTeacher recruitment jobs

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/crawl_jobteacher_browser.py'
      - 'scripts/validate_jobteacher_links.py'
      - '.github/workflows/update-jobteacher-jobs.yml'
  schedule:
    - cron: '43 * * * *'

permissions:
  contents: write

concurrency:
  group: metro-edujob-jobteacher
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Sync latest main
        run: |
          git fetch origin main
          git reset --hard origin/main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install collector dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt playwright
          python -m playwright install --with-deps chromium
      - name: Syntax check
        run: python -m py_compile scripts/crawl_jobteacher_browser.py scripts/validate_jobteacher_links.py
      - name: Collect isolated JobTeacher jobs
        id: collect
        continue-on-error: true
        run: python scripts/crawl_jobteacher_browser.py
      - name: Validate all current JobTeacher detail links
        id: detail_links
        if: steps.collect.outcome == 'success'
        continue-on-error: true
        run: python scripts/validate_jobteacher_links.py
      - name: Validate isolation and completeness gate
        id: validate
        if: steps.collect.outcome == 'success' && steps.detail_links.outcome == 'success'
        continue-on-error: true
        run: |
          python - <<'PY'
          import json, pathlib
          from datetime import datetime, timedelta, timezone
          kst_today=datetime.now(timezone(timedelta(hours=9))).date()
          r=json.loads(pathlib.Path('jobteacher_reconciliation_report.json').read_text(encoding='utf-8'))
          d=json.loads(pathlib.Path('jobteacher_detail_link_report.json').read_text(encoding='utf-8'))
          assert r.get('policy')=='jobteacher-active-browser-v2'
          assert r.get('publicationEnabled') is False
          assert r.get('healthy') is True
          assert r.get('traversalComplete') is True
          assert r.get('missingAfterCount')==0
          assert len(r.get('sourceReports') or [])==2
          assert all((x.get('ids') or 0)>0 and x.get('complete') for x in r['sourceReports'])
          assert d.get('policy')=='jobteacher-detail-link-browser-v1'
          assert d.get('healthy') is True
          assert d.get('detailCoverageComplete') is True
          assert d.get('detailErrorCount')==0
          assert d.get('tlsVerificationDisabled') is False
          jobs=json.loads(pathlib.Path('jobteacher_jobs.json').read_text(encoding='utf-8'))
          assert jobs and all(j.get('province') in {'서울','경기'} for j in jobs)
          assert all(str(j.get('sourceIdentity','')).startswith('jobteacher:') for j in jobs)
          assert d.get('currentIdCount') == len(jobs)
          assert all(set(j.get('provinces') or []) <= {'서울','경기'} and (j.get('provinces') or []) for j in jobs)
          assert all((not j.get('registered')) or datetime.fromisoformat(j['registered']).date() <= kst_today for j in jobs)
          multi=sum(1 for j in jobs if len(j.get('provinces') or [])>1)
          missing_dates=sum(1 for j in jobs if not j.get('registered'))
          assert multi > 0, 'expected cross-region postings to retain both provinces'
          assert missing_dates == 0, f'missing source-reported modified date: {missing_dates}'
          print(json.dumps({'healthy':r['healthy'],'count':len(jobs),'detailVerified':d['verifiedCurrentCount'],'multiProvince':multi,'missingDates':missing_dates,'sources':r['sourceReports']},ensure_ascii=False))
          PY
      - name: Verify current-posting semantics and enable publication
        id: promote
        if: steps.validate.outcome == 'success'
        continue-on-error: true
        run: |
          python - <<'PY'
          import json, pathlib, re
          from datetime import date, datetime, timedelta, timezone

          KST=timezone(timedelta(hours=9))
          today=datetime.now(KST).date()
          jobs=json.loads(pathlib.Path('jobteacher_jobs.json').read_text(encoding='utf-8'))
          report_path=pathlib.Path('jobteacher_reconciliation_report.json')
          report=json.loads(report_path.read_text(encoding='utf-8'))

          closed=re.compile(r'마감|채용완료|모집완료|종료')
          indefinite=re.compile(r'상시채용|채용시까지')
          dday=re.compile(r'D-(\d+)')
          monthday=re.compile(r'~\s*(\d{1,2})[.]\s*(\d{1,2})')
          bad=[]
          kinds={'indefinite':0,'dday':0,'dated':0}

          for j in jobs:
              raw=' '.join(str(j.get(k) or '') for k in ('applyEndText','rawRowText'))
              deadline=str(j.get('applyEndText') or '').strip()
              if closed.search(raw):
                  bad.append((j.get('sourceIdentity'),'closed-marker',deadline)); continue
              if indefinite.search(deadline):
                  kinds['indefinite']+=1; continue
              m=dday.search(deadline)
              if m:
                  kinds['dday']+=1; continue
              m=monthday.search(deadline)
              if m:
                  month,day=map(int,m.groups())
                  try:
                      end=date(today.year,month,day)
                  except ValueError:
                      bad.append((j.get('sourceIdentity'),'invalid-deadline',deadline)); continue
                  # JobTeacher omits the year. Only permit a year rollover in the
                  # narrow, unambiguous New-Year window: Jan/Feb scanning a Nov/Dec
                  # deadline. At all other times, a past MM.DD is expired.
                  if end < today and today.month <= 2 and month >= 11:
                      end=date(today.year+1,month,day)
                  if end < today:
                      bad.append((j.get('sourceIdentity'),'expired-deadline',deadline)); continue
                  kinds['dated']+=1; continue
              bad.append((j.get('sourceIdentity'),'unclassified-deadline',deadline))

          assert not bad, f'current-posting semantics failed: {bad[:20]} (total={len(bad)})'
          assert sum(kinds.values()) == len(jobs)
          report['publicationEnabled']=True
          report['currentPostingSemantics']={
              'policy':'source-visible-open-row-v1',
              'verifiedAt':datetime.now(KST).isoformat(timespec='seconds'),
              'rule':'public listing row must have no closed marker and deadline must be indefinite, nonnegative D-day, or nonexpired MM.DD; year rollover is allowed only Jan/Feb -> Nov/Dec',
              'counts':kinds,
              'rejectedCount':0,
          }
          report['nextGate']='unified candidate + validator + regression'
          report_path.write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps({'publicationEnabled':True,'count':len(jobs),'deadlineKinds':kinds},ensure_ascii=False))
          PY
      - name: Commit isolated evidence and healthy dataset
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add jobteacher_jobs.json jobteacher_source_id_ledger.json jobteacher_reconciliation_report.json jobteacher_collection_state.json jobteacher_detail_link_ledger.json jobteacher_detail_link_report.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m 'Update isolated JobTeacher recruitment collection'
            for i in 1 2 3; do
              git pull --rebase origin main && git push origin HEAD:main && break
              sleep $((i*5))
            done
          fi
      - name: Fail after preserving diagnostics
        if: steps.collect.outcome != 'success' || steps.detail_links.outcome != 'success' || steps.validate.outcome != 'success' || steps.promote.outcome != 'success'
        run: exit 1
