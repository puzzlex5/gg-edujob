name: Probe ArtMore region hierarchy

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/probe_artmore_region_hierarchy.py'
      - '.github/workflows/probe-artmore-region-hierarchy.yml'

permissions:
  contents: write

concurrency:
  group: metro-edujob-artmore-region-hierarchy
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sync latest main
        run: |
          git fetch origin main
          git reset --hard origin/main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser probe dependencies
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps chromium
      - name: Syntax check
        run: python -m py_compile scripts/probe_artmore_region_hierarchy.py
      - name: Inspect second-level region selector structure
        id: probe
        continue-on-error: true
        run: python scripts/probe_artmore_region_hierarchy.py
      - name: Validate isolation gate
        if: always()
        run: |
          python - <<'PY'
          import json, pathlib
          p=pathlib.Path('artmore_region_hierarchy_report.json')
          assert p.exists(), 'region hierarchy report missing'
          d=json.loads(p.read_text(encoding='utf-8'))
          assert d.get('publicationEnabled') is False
          assert d.get('mode') == 'read-only-region-hierarchy-probe-v1'
          print(json.dumps(d.get('summary',{}),ensure_ascii=False,indent=2))
          PY
      - name: Commit diagnostic evidence
        if: always()
        run: |
          test -f artmore_region_hierarchy_report.json || exit 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add artmore_region_hierarchy_report.json
          git diff --cached --quiet && exit 0
          git commit -m 'Record ArtMore region hierarchy probe'
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && break
            sleep $((i*4))
          done
      - name: Fail visibly only when probe execution failed
        if: steps.probe.outcome != 'success'
        run: exit 1
