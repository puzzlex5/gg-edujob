name: Enable collector queue preservation

on:
  push:
    paths:
      - '.github/workflows/enable-collector-queue.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Enable FIFO queue preservation for data writers
        run: |
          python - <<'PY'
          from pathlib import Path

          paths = [
              Path('.github/workflows/update-jobs.yml'),
              Path('.github/workflows/recover-missing-jobs.yml'),
              Path('.github/workflows/daily-deep-audit.yml'),
          ]
          old = "concurrency:\n  group: metro-edujob-data\n  cancel-in-progress: false\n"
          new = "concurrency:\n  group: metro-edujob-data\n  cancel-in-progress: false\n  queue: max\n"
          for path in paths:
              text = path.read_text(encoding='utf-8')
              if new in text:
                  print('already queued', path)
                  continue
              if old not in text:
                  raise SystemExit(f'Expected concurrency block missing in {path}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')
              print('queue enabled', path)
          PY
      - name: Commit queue-safe workflows
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/update-jobs.yml .github/workflows/recover-missing-jobs.yml .github/workflows/daily-deep-audit.yml
          git diff --cached --quiet && exit 0
          git commit -m 'Queue collector workflows instead of canceling pending audits'
          git pull --rebase
          git push
