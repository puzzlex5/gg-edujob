name: Probe Public Instructor API contract

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/probe_public_instructor_api_contract.py'
      - '.github/workflows/probe-public-instructor-api-contract.yml'

permissions:
  contents: write

concurrency:
  group: metro-edujob-public-instructor-api-contract
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sync latest main
        run: |
          git fetch origin main
          git reset --hard origin/main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Syntax check
        run: python -m py_compile scripts/probe_public_instructor_api_contract.py
      - name: Probe API contract
        id: probe
        continue-on-error: true
        run: python scripts/probe_public_instructor_api_contract.py
      - name: Validate publication isolation
        if: always()
        run: |
          python - <<'PY'
          import json,pathlib
          p=pathlib.Path('public_instructor_api_contract_report.json')
          assert p.exists(), 'missing report'
          d=json.loads(p.read_text(encoding='utf-8'))
          assert d.get('publicationEnabled') is False
          assert d.get('mode') == 'read-only-api-contract-probe'
          print(json.dumps(d.get('summary',{}),ensure_ascii=False))
          PY
      - name: Commit evidence
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public_instructor_api_contract_report.json 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -m 'Record Public Instructor API contract'
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && break
            sleep $((i*4))
          done
      - name: Fail after preserving diagnostics
        if: steps.probe.outcome != 'success'
        run: exit 1
