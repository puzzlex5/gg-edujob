name: Hotfix full support-office coverage and desktop scroll

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/hotfix_full_coverage_ui.py'

permissions:
  contents: write

concurrency:
  group: full-coverage-ui-hotfix
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Apply coverage and UI hotfix
        run: |
          python scripts/hotfix_full_coverage_ui.py
          python -m py_compile scripts/scrape_jobs.py scripts/repair_gyeonggi_support.py scripts/resolve_support_links.py
      - name: Commit hotfix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html scripts/scrape_jobs.py scripts/repair_gyeonggi_support.py scripts/resolve_support_links.py
          git diff --cached --quiet && exit 0
          git commit -m 'Remove support-office page caps and add independent desktop scrolling'
          git pull --rebase
          git push
