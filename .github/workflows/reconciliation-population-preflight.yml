name: Reconciliation population preflight

on:
  pull_request:
    paths:
      - 'scripts/verify_central_pagination.py'
      - 'scripts/scrape_jobs.py'
      - 'scripts/reconcile_source_ids.py'
      - 'scripts/verify_central_reconciliation_consistency.py'
      - '.github/workflows/reconciliation-population-preflight.yml'

permissions:
  contents: read

concurrency:
  group: reconciliation-population-preflight-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  live-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Compile reconciliation population proof
        run: |
          python -m py_compile scripts/verify_central_pagination.py scripts/reconcile_source_ids.py scripts/verify_central_reconciliation_consistency.py scripts/scrape_jobs.py
      - name: Apply production pagination hardeners
        run: |
          python scripts/harden_central_pagination.py
          python scripts/harden_reconciliation_central_lookback.py
      - name: Prove structural pagination before reconciliation
        run: python scripts/verify_central_pagination.py
      - name: Refresh independent Gyeonggi 90-day evidence
        run: python scripts/verify_gyeonggi_central_90d.py
      - name: Reconcile current official source IDs without publishing
        run: python scripts/reconcile_source_ids.py
      - name: Re-prove the same live population and require agreement
        run: |
          python scripts/verify_central_pagination.py
          python scripts/verify_central_reconciliation_consistency.py
      - name: Assert structural IDs are never hidden by recruitment filtering
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path('central_pagination_report.json').read_text(encoding='utf-8'))
          assert report.get('complete') is True, report
          for source in report.get('sources', []):
              parsed=int(source.get('parsedStableIdCount') or 0)
              recruitment=int(source.get('stableIdCount') or 0)
              excluded=int(source.get('excludedNonRecruitmentCount') or 0)
              assert parsed >= recruitment > 0, source
              assert parsed - recruitment == excluded, source
          print('population-aligned central proof', [(s.get('name'), s.get('parsedStableIdCount'), s.get('stableIdCount'), s.get('excludedNonRecruitmentCount')) for s in report.get('sources', [])])
          PY
