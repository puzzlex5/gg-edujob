name: Recover missing 수도권 education jobs

on:
  workflow_dispatch:
  schedule:
    - cron: '47 1,7,13,16 * * *' # KST 10:47,16:47,22:47,01:47; 04:23~06:53 정밀감사 창 보호

permissions:
  contents: write

concurrency:
  group: metro-edujob-data
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Preserve current verified publication
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('jobs.json').read_text(encoding='utf-8'))
          jobs=d.get('jobs',[]) if isinstance(d,dict) else []
          if len(jobs)<100: raise SystemExit(f'Unsafe recovery baseline: {len(jobs)} jobs')
          PY
          cp jobs.json /tmp/jobs_recovery_base.json

      - name: Prepare resilient deep audit collectors
        run: |
          python scripts/hotfix_sources.py
          python scripts/hotfix_repair_links.py
          python scripts/harden_deep_audit.py
          python scripts/harden_network_retries.py
          python -m py_compile scripts/scrape_jobs.py scripts/repair_gyeonggi_support.py scripts/complete_support_coverage.py scripts/merge_recovery_snapshot.py scripts/resolve_support_links.py scripts/enrich_support_periods.py scripts/enrich_seoul_get_fallback.py scripts/verify_support_completeness.py scripts/verify_jobs.py scripts/update_collection_state.py scripts/sanitize_job_dates.py scripts/harden_deep_audit.py

      - name: Fresh crawl of central portals and support offices
        run: python scripts/scrape_jobs.py

      - name: Re-check Gyeonggi support-office boards
        run: python scripts/repair_gyeonggi_support.py

      - name: Gap audit pass 1 through recent 90-day boundary
        run: python scripts/complete_support_coverage.py

      - name: Gap audit pass 2 after transient-failure delay
        run: |
          sleep 12
          python scripts/complete_support_coverage.py

      - name: Sanitize impossible registration dates
        run: python scripts/sanitize_job_dates.py

      - name: Merge fresh snapshot with previously published active postings
        run: python scripts/merge_recovery_snapshot.py --previous /tmp/jobs_recovery_base.json --report missing_recovery_report.json

      - name: Resolve exact links and periods
        run: |
          python scripts/resolve_support_links.py
          python scripts/enrich_support_periods.py
          python scripts/enrich_seoul_get_fallback.py

      - name: Require proven support-office traversal and exact links
        run: python scripts/verify_support_completeness.py

      - name: Validate recovered dataset against published baseline
        run: python scripts/verify_jobs.py --previous /tmp/jobs_recovery_base.json

      - name: Persist append-only recruitment ledger and checkpoints
        run: python scripts/update_collection_state.py

      - name: Recovery loss guard
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          before=json.loads(Path('/tmp/jobs_recovery_base.json').read_text(encoding='utf-8')).get('jobs',[])
          after=json.loads(Path('jobs.json').read_text(encoding='utf-8')).get('jobs',[])
          if len(after)<100: raise SystemExit(f'Recovery output too small: {len(after)}')
          if len(before)>=100 and len(after)<len(before)*0.70:
              raise SystemExit(f'Recovery unexpectedly lost >30%: {len(before)} -> {len(after)}')
          print(f'Recovery guard passed: {len(before)} -> {len(after)}')
          PY

      - name: Commit only verified recovered postings
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add jobs.json job_ledger.json collection_state.json board_cache.json missing_recovery_report.json date_anomaly_report.json support_coverage_report.json support_link_resolution.json support_period_cache.json sources.json scripts/scrape_jobs.py scripts/repair_gyeonggi_support.py scripts/complete_support_coverage.py scripts/verify_support_completeness.py scripts/resolve_support_links.py scripts/enrich_support_periods.py scripts/enrich_seoul_get_fallback.py scripts/harden_deep_audit.py
          git diff --cached --quiet && exit 0
          git commit -m 'Recover missed recruitment postings from official sources'
          git pull --rebase
          git push
