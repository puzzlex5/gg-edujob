name: Reconciliation proof-window regression

on:
  pull_request:
    paths:
      - 'scripts/verify_central_reconciliation_consistency.py'
      - '.github/workflows/source-id-reconciliation.yml'
      - '.github/workflows/reconciliation-proof-window-regression.yml'

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Compile verifier
        run: python -m py_compile scripts/verify_central_reconciliation_consistency.py
      - name: Require one explicit 90-day scan and read-only consistency checks
        run: |
          python - <<'PY'
          from pathlib import Path
          import ast

          verifier = Path('scripts/verify_central_reconciliation_consistency.py').read_text(encoding='utf-8')
          workflow = Path('.github/workflows/source-id-reconciliation.yml').read_text(encoding='utf-8')

          tree = ast.parse(verifier)
          imports = {a.name for n in ast.walk(tree) if isinstance(n, ast.Import) for a in n.names}
          if 'subprocess' in imports:
              raise SystemExit('consistency verifier must not regenerate live proof via subprocess')
          if 'verify_gyeonggi_central_90d.py' in verifier:
              raise SystemExit('consistency verifier must consume, not regenerate, the 90-day proof')

          explicit = workflow.count('run: python scripts/verify_gyeonggi_central_90d.py')
          if explicit != 1:
              raise SystemExit(f'expected exactly one explicit 90-day proof generation step, got {explicit}')
          if workflow.count('python scripts/verify_central_reconciliation_consistency.py') < 2:
              raise SystemExit('expected repeated read-only consistency checks in reconciliation workflow')
          print({'explicit90dScans': explicit, 'readOnlyConsistency': True})
          PY
      - name: Prove bounded timestamp semantics without refreshing proof
        run: |
          python - <<'PY'
          import importlib.util
          from pathlib import Path

          p = Path('scripts/verify_central_reconciliation_consistency.py')
          spec = importlib.util.spec_from_file_location('consistency', p)
          m = importlib.util.module_from_spec(spec); spec.loader.exec_module(m)
          r = m.parse_kst('2026-09-06 12:11:54 KST')
          g = m.parse_kst('2026-09-06 12:40:41 KST')
          skew = abs((g-r).total_seconds())/60
          assert skew < m.MAX_SKEW_MINUTES, (skew, m.MAX_SKEW_MINUTES)
          late = m.parse_kst('2026-09-06 13:01:41 KST')
          assert abs((late-r).total_seconds())/60 > m.MAX_SKEW_MINUTES
          print({'originalProofSkewMinutes': round(skew,2), 'lateRegeneratedProofWouldFail': True})
          PY
