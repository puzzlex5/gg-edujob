name: Audit all Lessoninfo cold links

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/audit_lessoninfo_cold_links.py'
      - '.github/workflows/audit-lessoninfo-cold-links.yml'

permissions:
  contents: write

concurrency:
  group: lessoninfo-cold-link-full-audit
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Playwright
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps chromium
      - name: Syntax check
        run: python -m py_compile scripts/audit_lessoninfo_cold_links.py
      - name: Audit every currently published Lessoninfo job from a cold mobile context
        env:
          LESSONINFO_COLD_AUDIT_CONCURRENCY: '8'
        run: python scripts/audit_lessoninfo_cold_links.py
      - name: Commit full audit evidence to branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lessoninfo_cold_link_audit.json
          git diff --cached --quiet && exit 0
          git commit -m 'Record full Lessoninfo cold-link audit'
          git push origin HEAD:${GITHUB_REF_NAME}
