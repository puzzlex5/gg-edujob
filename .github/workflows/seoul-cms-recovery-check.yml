name: Seoul CMS recovery regression check

on:
  pull_request:
    paths:
      - 'scripts/recover_seoul_office_cms_jobs.py'
      - '.github/workflows/seoul-cms-recovery-check.yml'
  push:
    paths:
      - 'scripts/recover_seoul_office_cms_jobs.py'
      - '.github/workflows/seoul-cms-recovery-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install collector dependencies
        run: pip install -r requirements.txt
      - name: Compile recovery path
        run: python -m py_compile scripts/recover_seoul_office_cms_jobs.py
      - name: Enforce persistent-URL-only deduplication
        run: python scripts/recover_seoul_office_cms_jobs.py --self-test
