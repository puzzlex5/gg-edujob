name: Restore missing reconciled official IDs

on:
  workflow_dispatch:
  schedule:
    # Fast refresh starts at minute 17 of UTC hours 0,2,...,16.
    # Start targeted restore 55 minutes earlier so its 45-minute timeout has a 10-minute buffer.
    - cron: '22 1,3,5,7,9,11,13,15,23 * * *'

permissions:
  contents: write

concurrency:
  group: metro-edujob-data
  cancel-in-progress: false

jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Synchronize latest main after any queue delay
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
          echo "RESTORE_BASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "RESTORE_PUSH_STATE=not-attempted" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Preserve published baseline
        run: |
          cp jobs.json /tmp/jobs_before_restore.json
          python -m py_compile scripts/restore_reconciled_ids.py scripts/crawl_gyeonggi_central_recent.py scripts/reconcile_source_ids.py scripts/complete_support_coverage.py scripts/scrape_jobs.py scripts/verify_jobs.py scripts/sync_effective_audit_status.py
      - name: Restore only missing ledger-protected official IDs
        run: python scripts/restore_reconciled_ids.py
      - name: Re-sanitize and verify restored publication
        run: |
          python scripts/sanitize_job_dates.py
          python scripts/verify_jobs.py --previous /tmp/jobs_before_restore.json
          python scripts/update_collection_state.py
          python scripts/update_collector_status.py --workflow official-id-restore --stage complete --state success
          python scripts/sync_effective_audit_status.py
      - name: Commit only verified restoration
        shell: bash
        run: |
          set -euo pipefail
          set_state() { echo "RESTORE_PUSH_STATE=$1" >> "$GITHUB_ENV"; }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # update_collection_state.py refreshes job_ledger.json as part of the same verified
          # checkpoint. Stage it with the rest so pull --rebase never sees a dirty worktree.
          git add jobs.json job_ledger.json collection_state.json collector_status.json deep_audit_status.json official_id_restore_report.json date_anomaly_report.json
          if git diff --cached --quiet; then
            set_state no-change
            exit 0
          fi
          git commit -m 'Restore missing reconciled official recruitment IDs'

          pushed=0
          for attempt in 1 2 3; do
            if ! git pull --rebase origin main; then
              git rebase --abort || true
              sleep $((attempt * 5))
              continue
            fi
            if git push origin HEAD:main; then
              pushed=1
              break
            fi

            # A transport error can be reported after the remote accepted the commit. Verify before
            # declaring a failed publication.
            if git fetch origin main && git merge-base --is-ancestor HEAD origin/main; then
              set_state verified-after-push-error
              exit 0
            fi
            sleep $((attempt * 5))
          done

          if [ "$pushed" = "1" ]; then
            if git fetch origin main && git merge-base --is-ancestor HEAD origin/main; then
              set_state verified
              exit 0
            fi
            set_state pushed-verification-unavailable
            echo '::error::restore push returned success but publication verification was unavailable'
            exit 1
          fi

          if git fetch origin main; then
            if git merge-base --is-ancestor HEAD origin/main; then
              set_state verified-after-push-error
              exit 0
            fi
            set_state push-failed
            echo '::error::restore push failed after 3 attempts and commit is absent from origin/main'
          else
            set_state publication-uncertain
            echo '::error::restore push failed and origin/main could not be fetched to determine publication state'
          fi
          exit 1
      - name: Preserve diagnostics without publishing incomplete restoration
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          push_state="${RESTORE_PUSH_STATE:-not-attempted}"
          echo "Restore failure publication state: ${push_state}"

          # Re-anchor on the actual remote LKG. HEAD may be an unpublished restore commit, so
          # discard tracked candidate residue specifically against origin/main before diagnostics.
          if ! git fetch origin main; then
            echo '::error::cannot safely publish restore diagnostics because origin/main is unavailable'
            exit 1
          fi
          git checkout -B main origin/main
          git reset --hard origin/main
          git clean -fd

          case "$push_state" in
            pushed-verification-unavailable|publication-uncertain)
              failure_stage='publication-verification'
              ;;
            push-failed)
              failure_stage='publication'
              ;;
            *)
              failure_stage='restore'
              ;;
          esac

          python scripts/update_collector_status.py --workflow official-id-restore --stage "$failure_stage" --state failed || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add collector_status.json
          git diff --cached --quiet && exit 0
          git commit -m 'Record failed targeted official-ID restoration'

          pushed=0
          for attempt in 1 2 3; do
            if ! git pull --rebase origin main; then
              git rebase --abort || true
              sleep $((attempt * 5))
              continue
            fi
            if git push origin HEAD:main; then
              pushed=1
              break
            fi
            sleep $((attempt * 5))
          done
          [ "$pushed" = "1" ] || { echo '::error::failed to publish restore diagnostics after 3 attempts'; exit 1; }
          git fetch origin main
          git merge-base --is-ancestor HEAD origin/main || exit 1
