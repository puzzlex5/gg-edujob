name: Deep audit schedule watchdog

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/deep-audit-watchdog.yml'
      - '.github/workflows/daily-deep-audit.yml'
  schedule:
    - cron: '23 19-23,0-3 * * *' # 04:23~12:23 KST: recover missed schedules and cancel stale delayed duplicates

permissions:
  contents: read
  actions: write

concurrency:
  group: deep-audit-schedule-watchdog
  cancel-in-progress: false

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Cancel stale delayed scheduled audits after today's verified success
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          success_at="$(python - <<'PY'
          import json
          from pathlib import Path
          try:
              d=json.loads(Path('deep_audit_status.json').read_text(encoding='utf-8'))
              print(d.get('lastSuccessAt','') if d.get('state') == 'success' else '')
          except Exception:
              print('')
          PY
          )"
          [ -n "$success_at" ] || exit 0

          gh api \
            -H 'Accept: application/vnd.github+json' \
            "/repos/${GITHUB_REPOSITORY}/actions/workflows/daily-deep-audit.yml/runs?per_page=30" \
            > /tmp/deep-audit-runs.json

          stale_ids="$(SUCCESS_AT="$success_at" python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path

          try:
              success = datetime.fromisoformat(os.environ['SUCCESS_AT']).astimezone(timezone.utc)
          except Exception:
              raise SystemExit(0)
          data=json.loads(Path('/tmp/deep-audit-runs.json').read_text(encoding='utf-8'))
          for run in data.get('workflow_runs', []):
              if run.get('event') != 'schedule' or run.get('status') not in ('queued','in_progress'):
                  continue
              raw=run.get('run_started_at') or run.get('created_at') or ''
              try:
                  started=datetime.fromisoformat(raw.replace('Z','+00:00')).astimezone(timezone.utc)
              except Exception:
                  continue
              # A direct scheduled audit that begins only after today's verified audit already
              # succeeded is a delayed duplicate. It can hold the shared data-write lock for hours.
              if started > success:
                  print(run.get('id'))
          PY
          )"

          for run_id in $stale_ids; do
            echo "Cancelling delayed duplicate daily audit run ${run_id}; today's verified audit already succeeded at ${success_at}."
            gh api --method POST \
              -H 'Accept: application/vnd.github+json' \
              "/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/cancel" || true
          done

      - name: Decide whether today's deep audit needs a fallback dispatch
        id: gate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from datetime import datetime, timedelta, timezone
          from pathlib import Path

          KST = timezone(timedelta(hours=9))
          now = datetime.now(KST)
          today = now.date()
          p = Path('deep_audit_status.json')
          try:
              d = json.loads(p.read_text(encoding='utf-8'))
          except Exception:
              d = {}

          def parse_kst(value):
              if not value:
                  return None
              try:
                  return datetime.fromisoformat(str(value)).astimezone(KST)
              except Exception:
                  return None

          success_at = parse_kst(d.get('lastSuccessAt'))
          updated_at = parse_kst(d.get('updatedAt'))
          state = str(d.get('state') or '')

          if success_at and success_at.date() == today and state == 'success':
              decision = 'skip-success'
          elif state == 'running' and updated_at and (now - updated_at) <= timedelta(hours=4):
              decision = 'skip-running'
          else:
              decision = 'dispatch'

          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as fh:
              fh.write(f'decision={decision}\n')
          print(json.dumps({
              'decision': decision,
              'nowKST': now.isoformat(),
              'state': state,
              'lastSuccessAt': d.get('lastSuccessAt'),
              'updatedAt': d.get('updatedAt'),
          }, ensure_ascii=False))
          PY
      - name: Dispatch fallback deep audit when no run is already active
        if: steps.gate.outputs.decision == 'dispatch'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          active="$(gh api \
            -H 'Accept: application/vnd.github+json' \
            "/repos/${GITHUB_REPOSITORY}/actions/workflows/daily-deep-audit.yml/runs?per_page=20" \
            --jq '[.workflow_runs[] | select(.status == "queued" or .status == "in_progress")] | length')"
          if [ "${active:-0}" -gt 0 ]; then
            echo "A daily deep audit is already queued/in progress; skipping duplicate fallback dispatch."
            exit 0
          fi
          gh api --method POST \
            -H 'Accept: application/vnd.github+json' \
            "/repos/${GITHUB_REPOSITORY}/actions/workflows/daily-deep-audit.yml/dispatches" \
            -f ref=main
          echo 'Fallback daily deep audit dispatched.'