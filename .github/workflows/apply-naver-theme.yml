name: Apply Naver-inspired site theme

on:
  workflow_dispatch:
  push:
    paths:
      - 'naver-theme.css'
      - 'mobile-ui.js'
      - '.github/workflows/apply-naver-theme.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Inject theme and mobile behavior safely
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          link='<link rel="stylesheet" href="naver-theme.css?v=20260823">'
          old='<link rel="stylesheet" href="naver-theme.css?v=20260822">'
          if old in s:
              s=s.replace(old, link, 1)
          elif link not in s:
              if '</head>' not in s:
                  raise SystemExit('Missing </head> in index.html')
              s=s.replace('</head>', link+'\n</head>', 1)
          script='<script src="mobile-ui.js?v=20260823" defer></script>'
          if script not in s:
              if '</body>' not in s:
                  raise SystemExit('Missing </body> in index.html')
              s=s.replace('</body>', script+'\n</body>', 1)
          s=s.replace('<meta name="theme-color" content="#0b1830" />','<meta name="theme-color" content="#03c75a" />')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Validate site script and mobile hooks
        run: |
          grep -q 'naver-theme.css?v=20260823' index.html
          grep -q 'mobile-ui.js?v=20260823' index.html
          grep -q '@media(max-width:900px)' naver-theme.css
          grep -q 'mobile-collapsed' mobile-ui.js
          node --check mobile-ui.js
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          blocks=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', s, re.S|re.I)
          Path('/tmp/site.js').write_text('\n'.join(blocks), encoding='utf-8')
          PY
          if [ -s /tmp/site.js ]; then node --check /tmp/site.js; fi
      - name: Commit visual refresh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html naver-theme.css mobile-ui.js
          git diff --cached --quiet && exit 0
          git commit -m 'Fix 수도권에듀잡 mobile responsive layout'
          git pull --rebase
          git push
