name: Probe Hunjang public recruitment structure

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
  push:
    paths:
      - 'scripts/probe_hunjang_browser.py'
      - 'scripts/probe_hunjang_public_bundles.py'
      - 'scripts/probe_hunjang_public_links.py'
      - 'scripts/harden_hunjang_probe_gate.py'
      - 'scripts/summarize_hunjang_probe.py'
      - '.github/workflows/probe-hunjang.yml'

permissions:
  contents: write

concurrency:
  group: probe-hunjang
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install probe dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Probe public Hunjang recruitment structure
        run: python scripts/probe_hunjang_browser.py
      - name: Inspect public Hunjang JS bundle API hints
        run: python scripts/probe_hunjang_public_bundles.py
      - name: Follow same-origin public recruitment links
        run: python scripts/probe_hunjang_public_links.py
      - name: Enforce general recruitment-list evidence gate
        run: python scripts/harden_hunjang_probe_gate.py
      - name: Write compact probe summary
        run: python scripts/summarize_hunjang_probe.py
      - name: Commit isolated probe evidence
        if: always() && github.ref == 'refs/heads/main'
        run: |
          if [ ! -f hunjang_probe_report.json ]; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add hunjang_probe_report.json
          if [ -f hunjang_probe_summary.json ]; then
            git add hunjang_probe_summary.json
          fi
          if [ -f hunjang_bundle_probe.json ]; then
            git add hunjang_bundle_probe.json
          fi
          if [ -f hunjang_public_link_probe.json ]; then
            git add hunjang_public_link_probe.json
          fi
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Record isolated Hunjang structure probe'
          git pull --rebase origin main
          git push origin HEAD:main
