name: Recover Seoul support-office CMS recruitment posts

on:
  workflow_dispatch:
  schedule:
    - cron: '37 1,3,5,7,9,11,13,15,22 * * *' # 10:37~00:37 KST + 07:37; 02:37 slot removed so delayed runs cannot intrude on deep-audit window

permissions:
  contents: write

concurrency:
  group: metro-edujob-data
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Preserve verified baseline
        run: |
          cp jobs.json /tmp/jobs_before_seoul_cms.json
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('jobs.json').read_text(encoding='utf-8'))
          if len(d.get('jobs',[])) < 100: raise SystemExit('Unsafe jobs baseline')
          PY
      - name: Refresh official-board discovery
        run: python scripts/discover_recruitment_boards.py
      - name: Recover conservative Seoul office CMS recruitment details
        run: python scripts/recover_seoul_office_cms_jobs.py
      - name: Verify recovered publication
        run: |
          python scripts/sanitize_job_dates.py
          python scripts/verify_jobs.py --previous /tmp/jobs_before_seoul_cms.json
          python scripts/update_collection_state.py
      - name: Require completeness proof to remain bound to recovered dataset
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, 'scripts')
          from update_collector_status import coverage_evidence
          evidence = coverage_evidence()
          if not evidence.get('currentComplete'):
              raise SystemExit(
                  'Refusing Seoul CMS publication: recovery no longer preserves a fresh '
                  'completeness proof bound to the current jobs dataset'
              )
          print('Seoul CMS publication guard passed via', evidence.get('proof'))
          PY
      - name: Rebase recovery on latest verified main and commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          # Another data workflow can update main while this job is crawling. Never rebase a
          # generated jobs.json across that change: it creates content conflicts and can overwrite
          # newer verified postings. Re-run the small CMS recovery on the newest published baseline.
          git fetch origin main
          git reset --hard origin/main
          git clean -fd
          cp jobs.json /tmp/jobs_latest_main.json

          python scripts/discover_recruitment_boards.py
          python scripts/recover_seoul_office_cms_jobs.py
          python scripts/sanitize_job_dates.py
          python scripts/verify_jobs.py --previous /tmp/jobs_latest_main.json
          python scripts/update_collection_state.py
          python - <<'PY'
          import sys
          sys.path.insert(0, 'scripts')
          from update_collector_status import coverage_evidence
          evidence = coverage_evidence()
          if not evidence.get('currentComplete'):
              raise SystemExit(
                  'Refusing Seoul CMS publication after latest-main replay: completeness proof '
                  'is not bound to the replayed dataset'
              )
          print('Latest-main Seoul CMS publication guard passed via', evidence.get('proof'))
          PY

          git add jobs.json job_ledger.json collection_state.json board_cache.json board_discovery_report.json seoul_office_cms_recovery_report.json date_anomaly_report.json
          git diff --cached --quiet && exit 0
          git commit -m 'Recover Seoul support-office CMS recruitment posts'
          git push origin HEAD:main
