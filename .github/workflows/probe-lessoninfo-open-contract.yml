name: Probe Lessoninfo open contract

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/probe_lessoninfo_open_contract.py'
      - '.github/workflows/probe-lessoninfo-open-contract.yml'

permissions:
  contents: write

concurrency:
  group: lessoninfo-open-contract-probe
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Playwright
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps chromium
      - name: Syntax check
        run: python -m py_compile scripts/probe_lessoninfo_open_contract.py
      - name: Probe cold, seeded and real list-click contracts
        run: python scripts/probe_lessoninfo_open_contract.py
      - name: Commit probe evidence to branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lessoninfo_open_contract_probe.json
          git diff --cached --quiet && exit 0
          git commit -m 'Record Lessoninfo open-contract probe'
          git push origin HEAD:${GITHUB_REF_NAME}
