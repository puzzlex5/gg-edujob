name: Validate ArtMore global current traversal

on:
  push:
    branches:
      - 'fix/artmore-global-current-postfilter-v7'
    paths:
      - 'scripts/crawl_artmore_browser_v7.py'
      - '.github/workflows/validate-artmore-global-current.yml'
  pull_request:
    paths:
      - 'scripts/crawl_artmore_browser_v7.py'
      - '.github/workflows/validate-artmore-global-current.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser dependencies
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps chromium
      - name: Syntax check
        run: python -m py_compile scripts/crawl_artmore_browser.py scripts/crawl_artmore_browser_v7.py
      - name: Run isolated global current traversal
        run: python scripts/crawl_artmore_browser_v7.py
      - name: Validate candidate safety gates
        run: |
          python - <<'PY'
          import json, pathlib, re
          report=json.loads(pathlib.Path('artmore_reconciliation_report.candidate.json').read_text(encoding='utf-8'))
          state=json.loads(pathlib.Path('artmore_collection_state.candidate.json').read_text(encoding='utf-8'))
          jobs=json.loads(pathlib.Path('artmore_jobs.candidate.json').read_text(encoding='utf-8')).get('jobs',[])
          assert report.get('publicationEnabled') is False
          assert report.get('healthy') is True, report.get('errors')
          assert report.get('traversalComplete') is True
          assert report.get('missingAfterCount') == 0
          assert report.get('rawCurrentIdsTraversed',0) >= len(jobs) > 0
          assert state.get('preservedPublishedDataset') is True
          assert set(report.get('provinceCounts',{})) == {'서울','경기'}
          assert all(report['provinceCounts'][p] > 0 for p in ('서울','경기'))
          assert all(j.get('province') in {'서울','경기'} for j in jobs)
          assert all((j.get('location') or '').startswith(('서울','경기')) for j in jobs)
          assert all(re.search(r'rec_idx=\d+', j.get('originalUrl') or '') for j in jobs)
          assert len({j['sourceIdentity'] for j in jobs}) == len(jobs)
          print(json.dumps({'jobs':len(jobs),'provinceCounts':report['provinceCounts'],
                            'pagesVisited':report['sourceReports'][0]['pagesVisited'],
                            'rawCurrentIdsTraversed':report['rawCurrentIdsTraversed']}, ensure_ascii=False, indent=2))
          PY
      - name: Upload isolated evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: artmore-global-current-evidence
          path: |
            artmore_jobs.candidate.json
            artmore_source_id_ledger.candidate.json
            artmore_reconciliation_report.candidate.json
            artmore_collection_state.candidate.json
