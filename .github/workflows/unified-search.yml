name: Unified recruitment search

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/build_unified_search.py'
      - 'scripts/build_unified_search_multi.py'
      - 'scripts/validate_unified_search.py'
      - 'scripts/validate_unified_search_multi.py'
      - 'scripts/crosscheck_private_official.py'
      - 'scripts/source_registry.py'
      - 'scripts/private_source_registry.py'
      - 'scripts/direct_post_links.py'
      - 'scripts/audit_direct_post_links.py'
      - 'scripts/apply_unified_frontend.py'
      - 'scripts/crawl_seekle_instructor_jobs.py'
      - 'scripts/crawl_boramyc_instructor_jobs.py'
      - 'seekle_jobs.json'
      - 'seekle_reconciliation_report.json'
      - 'boramyc_jobs.json'
      - 'boramyc_reconciliation_report.json'
      - 'unified-ui.js'
      - 'mobile-ui.js'
      - 'direct-link-guard.js'
      - '.github/workflows/unified-search.yml'
  push:
    paths:
      - 'scripts/build_unified_search.py'
      - 'scripts/build_unified_search_multi.py'
      - 'scripts/validate_unified_search.py'
      - 'scripts/validate_unified_search_multi.py'
      - 'scripts/crosscheck_private_official.py'
      - 'scripts/source_registry.py'
      - 'scripts/private_source_registry.py'
      - 'scripts/direct_post_links.py'
      - 'scripts/audit_direct_post_links.py'
      - 'scripts/apply_unified_frontend.py'
      - 'unified-ui.js'
      - 'mobile-ui.js'
      - 'direct-link-guard.js'
      - '.github/workflows/unified-search.yml'
      - 'artmore_jobs.json'
      - 'artmore_reconciliation_report.json'
      - 'artmore_detail_link_report.json'
      - 'jobteacher_jobs.json'
      - 'jobteacher_reconciliation_report.json'
      - 'jobteacher_detail_link_report.json'
      - 'lessoninfo_jobs.json'
      - 'lessoninfo_reconciliation_report.json'
      - 'gonggonggangsa_jobs.json'
      - 'gonggonggangsa_reconciliation_report.json'
      - 'gonggonggangsa_detail_link_report.json'
      - 'seekle_jobs.json'
      - 'seekle_reconciliation_report.json'
      - 'boramyc_jobs.json'
      - 'boramyc_reconciliation_report.json'
  workflow_run:
    workflows:
      - 'Update 수도권 education jobs'
      - 'Update Lessoninfo recruitment jobs'
      - 'Update JobTeacher recruitment jobs'
      - 'Promote verified ArtMore jobs'
      - 'Update Gonggonggangsa jobs'
      - 'Update Seekle instructor jobs'
      - 'Update Boramae instructor jobs'
    types: [completed]
  schedule:
    - cron: '47 * * * *'

permissions:
  contents: write

concurrency:
  group: metro-edujob-data-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Synchronize latest canonical datasets for production runs
        if: github.event_name == 'schedule' || github.event_name == 'workflow_run' || (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
        run: |
          git fetch origin main
          git checkout -B main origin/main
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Syntax check unified multi-source pipeline and UI
        run: |
          python -m py_compile scripts/source_registry.py scripts/private_source_registry.py scripts/build_unified_search.py scripts/build_unified_search_multi.py scripts/validate_unified_search_multi.py scripts/crosscheck_private_official.py scripts/direct_post_links.py scripts/audit_direct_post_links.py scripts/apply_unified_frontend.py scripts/crawl_seekle_instructor_jobs.py scripts/crawl_boramyc_instructor_jobs.py
          node --check unified-ui.js
          node --check mobile-ui.js
          node --check direct-link-guard.js
      - name: Verify source registries resolve independently
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0,'scripts')
          from source_registry import official_source_count
          from private_source_registry import private_source_keys
          official=official_source_count(); private=private_source_keys()
          assert official > 0
          assert len(private) == len(set(private))
          assert set(private) >= {'lessoninfo','jobteacher','artmore','gonggonggangsa','seekle','boramyc'}
          print('registry check', official, private)
          PY
      - name: Build disposable multi-source unified candidate
        id: build_candidate
        continue-on-error: true
        run: python scripts/build_unified_search_multi.py
      - name: Repair stable-ID links and audit exact posting destinations
        id: link_audit
        if: steps.build_candidate.outcome == 'success'
        continue-on-error: true
        run: python scripts/audit_direct_post_links.py --input unified_jobs.next.json --repair-in-place --strict-clickable
      - name: Validate candidate against every publication-enabled canonical source
        id: validate_candidate
        if: steps.build_candidate.outcome == 'success' && steps.link_audit.outcome == 'success'
        continue-on-error: true
        run: python scripts/validate_unified_search_multi.py
      - name: Crosscheck private school signals against official data
        id: crosscheck
        if: steps.validate_candidate.outcome == 'success'
        continue-on-error: true
        run: python scripts/crosscheck_private_official.py
      - name: Publish only verified unified dataset
        if: steps.build_candidate.outcome == 'success' && steps.link_audit.outcome == 'success' && steps.validate_candidate.outcome == 'success'
        run: |
          mv unified_jobs.next.json unified_jobs.json
          python scripts/apply_unified_frontend.py
          grep -q "fetch('unified_jobs.json',{cache:'no-cache'})" index.html
          grep -q 'unified-ui.js' index.html
          grep -q 'direct-link-guard.js' index.html
          python - <<'PY'
          import json,sys
          sys.path.insert(0,'scripts')
          from private_source_registry import private_source_keys
          from source_registry import official_source_count
          from direct_post_links import is_direct_post
          d=json.load(open('unified_jobs.json',encoding='utf-8'))
          assert d.get('dataset') == 'unified-search-v3-multi-private'
          private=d.get('privateSources',{}); expected=set(private_source_keys())
          assert set(private) == expected, (set(private), expected)
          official_count=official_source_count(); assert int(d.get('officialSourceCount') or 0) == official_count
          enabled={k for k,v in private.items() if (v or {}).get('publicationEnabled') is True}
          assert d.get('totalSourceCount') == official_count + len(enabled), (d.get('totalSourceCount'), official_count, enabled)
          assert all((private[k] or {}).get('ok') for k in enabled)
          assert all(int((private[k] or {}).get('count') or 0) == 0 for k in expected-enabled)
          assert any(j.get('feedKind')=='official' for j in d['jobs'])
          assert any(j.get('feedKind')=='private' for j in d['jobs'])
          for key in enabled:
              source_name=(private[key] or {}).get('name')
              assert any(j.get('source')==source_name for j in d['jobs']) or int((private[key] or {}).get('count') or 0) == 0
          disabled_names={(private[k] or {}).get('name') for k in expected-enabled}
          leaked=[j for j in d['jobs'] if j.get('feedKind')=='private' and j.get('source') in disabled_names]
          assert not leaked, f'publication-disabled private rows: {len(leaked)}'
          allowed={'서울','경기'}
          def provinces(j):
              ps={str(x) for x in (j.get('provinces') or []) if str(x)}
              if ps: return ps
              p=str(j.get('province') or '')
              return {p} if p else set()
          bad=[j for j in d['jobs'] if j.get('feedKind')=='private' and (not provinces(j) or not provinces(j).issubset(allowed))]
          assert not bad, f'non-metro private rows: {len(bad)}'
          unsafe=[j for j in d['jobs'] if j.get('detailLinkVerified') is not False and not is_direct_post(j)[0]]
          assert not unsafe, f'unsafe clickable posting links: {len(unsafe)}'
          seekle=[j for j in d['jobs'] if j.get('sourceIdentity')=='seekle:21827']
          assert len(seekle)==1 and seekle[0].get('applyEnd')=='2026-09-18'
          assert '강사' in seekle[0].get('searchText','') and '문화예술' in seekle[0].get('searchText','') and is_direct_post(seekle[0])[0]
          if 'boramyc' in enabled:
              boramyc=[j for j in d['jobs'] if j.get('sourceIdentity')=='boramyc:25441']
              assert len(boramyc)==1
              assert boramyc[0].get('applyEnd')=='2026-09-10'
              assert '강사' in boramyc[0].get('searchText','') and '당구' in boramyc[0].get('searchText','') and '체육' in boramyc[0].get('searchText','')
              assert is_direct_post(boramyc[0])[0]
          print('verified publication-gated multi-source unified publication',len(d['jobs']),official_count,sorted(enabled))
          PY
      - name: Commit verified search projection or diagnostics
        if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_run' || (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'))
        run: |
          rm -f unified_jobs.next.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add unified_search_report.json unified_validation_report.json unified_crosscheck_report.json direct_post_link_report.json 2>/dev/null || true
          if [ "${{ steps.build_candidate.outcome }}" = success ] && [ "${{ steps.link_audit.outcome }}" = success ] && [ "${{ steps.validate_candidate.outcome }}" = success ]; then
            git add unified_jobs.json index.html
          fi
          git diff --cached --quiet && exit 0
          git commit -m 'Publish verified multi-source recruitment search'
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && break
            sleep $((i*4))
          done
      - name: Clean branch/PR test artifacts
        if: always() && !(github.event_name == 'schedule' || github.event_name == 'workflow_run' || (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'))
        run: rm -f unified_jobs.next.json
      - name: Fail after preserving diagnostics
        if: steps.build_candidate.outcome != 'success' || steps.link_audit.outcome == 'failure' || steps.validate_candidate.outcome != 'success' || steps.crosscheck.outcome == 'failure'
        run: exit 1
