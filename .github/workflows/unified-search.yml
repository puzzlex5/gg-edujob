name: Unified recruitment search

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/build_unified_search.py'
      - 'scripts/build_unified_search_multi.py'
      - 'scripts/validate_unified_search.py'
      - 'scripts/validate_unified_search_multi.py'
      - 'scripts/crosscheck_private_official.py'
      - 'scripts/apply_unified_frontend.py'
      - 'unified-ui.js'
      - 'mobile-ui.js'
      - '.github/workflows/unified-search.yml'
      - 'artmore_jobs.json'
      - 'artmore_reconciliation_report.json'
      - 'artmore_detail_link_report.json'
      - 'jobteacher_jobs.json'
      - 'lessoninfo_jobs.json'
  workflow_run:
    workflows:
      - 'Update 수도권 education jobs'
      - 'Update Lessoninfo recruitment jobs'
      - 'Update JobTeacher recruitment jobs'
      - 'Promote verified ArtMore jobs'
    types: [completed]
  schedule:
    - cron: '47 * * * *'

permissions:
  contents: write

concurrency:
  group: metro-edujob-unified
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Synchronize latest canonical datasets
        run: |
          git fetch origin main
          git checkout -B main origin/main
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Syntax check unified multi-source pipeline and UI
        run: |
          python -m py_compile scripts/build_unified_search.py scripts/build_unified_search_multi.py scripts/validate_unified_search_multi.py scripts/crosscheck_private_official.py scripts/apply_unified_frontend.py
          node --check unified-ui.js
          node --check mobile-ui.js
      - name: Build disposable multi-source unified candidate
        id: build_candidate
        continue-on-error: true
        run: python scripts/build_unified_search_multi.py
      - name: Validate candidate against every publication-enabled canonical source
        id: validate_candidate
        if: steps.build_candidate.outcome == 'success'
        continue-on-error: true
        run: python scripts/validate_unified_search_multi.py
      - name: Crosscheck private school signals against official data
        id: crosscheck
        if: steps.validate_candidate.outcome == 'success'
        continue-on-error: true
        run: python scripts/crosscheck_private_official.py
      - name: Publish only verified unified dataset
        if: steps.build_candidate.outcome == 'success' && steps.validate_candidate.outcome == 'success'
        run: |
          mv unified_jobs.next.json unified_jobs.json
          python scripts/apply_unified_frontend.py
          grep -q "fetch('unified_jobs.json',{cache:'no-cache'})" index.html
          grep -q 'unified-ui.js' index.html
          python - <<'PY'
          import json
          d=json.load(open('unified_jobs.json',encoding='utf-8'))
          assert d.get('dataset') == 'unified-search-v3-multi-private'
          private=d.get('privateSources',{})
          expected={'lessoninfo','jobteacher','artmore'}
          assert expected.issubset(set(private))
          enabled={k for k,v in private.items() if (v or {}).get('publicationEnabled') is True}
          assert d.get('totalSourceCount') == 38 + len(enabled), (d.get('totalSourceCount'), enabled)
          assert all((private[k] or {}).get('ok') for k in enabled)
          assert all(int((private[k] or {}).get('count') or 0) == 0 for k in expected-enabled)
          assert any(j.get('feedKind')=='official' for j in d['jobs'])
          assert any(j.get('feedKind')=='private' for j in d['jobs'])
          for key in enabled:
              source_name=(private[key] or {}).get('name')
              assert any(j.get('source')==source_name for j in d['jobs']) or int((private[key] or {}).get('count') or 0) == 0
          disabled_names={(private[k] or {}).get('name') for k in expected-enabled}
          leaked=[j for j in d['jobs'] if j.get('feedKind')=='private' and j.get('source') in disabled_names]
          assert not leaked, f'publication-disabled private rows: {len(leaked)}'
          bad=[j for j in d['jobs'] if j.get('feedKind')=='private' and j.get('province') not in {'서울','경기'}]
          assert not bad, f'non-metro private rows: {len(bad)}'
          print('verified publication-gated multi-source unified publication',len(d['jobs']),sorted(enabled))
          PY
      - name: Commit verified search projection or diagnostics
        if: always()
        run: |
          rm -f unified_jobs.next.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add unified_search_report.json unified_validation_report.json unified_crosscheck_report.json 2>/dev/null || true
          if [ "${{ steps.build_candidate.outcome }}" = success ] && [ "${{ steps.validate_candidate.outcome }}" = success ]; then
            git add unified_jobs.json index.html
          fi
          git diff --cached --quiet && exit 0
          git commit -m 'Publish verified multi-source recruitment search'
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && break
            sleep $((i*4))
          done
      - name: Fail after preserving diagnostics
        if: steps.build_candidate.outcome != 'success' || steps.validate_candidate.outcome != 'success' || steps.crosscheck.outcome == 'failure'
        run: exit 1
