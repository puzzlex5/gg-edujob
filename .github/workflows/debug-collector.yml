name: Diagnose fast collector hardening

on:
  push:
    paths:
      - '.github/workflows/debug-collector.yml'

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4
      - name: Run hardening chain and capture exact failure
        shell: bash
        run: |
          set +e
          : > hardening-debug.txt
          for cmd in \
            "python scripts/hotfix_sources.py" \
            "python scripts/hotfix_support_office.py" \
            "python scripts/hotfix_repair_links.py" \
            "python scripts/harden_fast_pagination.py" \
            "python scripts/harden_network_retries.py" \
            "python -m py_compile scripts/scrape_jobs.py scripts/repair_gyeonggi_support.py scripts/resolve_support_links.py scripts/enrich_support_periods.py scripts/enrich_seoul_get_fallback.py scripts/verify_jobs.py scripts/merge_recovery_snapshot.py scripts/update_collection_state.py scripts/update_collector_status.py" \
            "grep -q 'FAST_MAX_PAGES = 60' scripts/scrape_jobs.py" \
            "grep -q 'RETRY_POLICY = Retry' scripts/scrape_jobs.py"
          do
            echo "=== $cmd ===" >> hardening-debug.txt
            bash -lc "$cmd" >> hardening-debug.txt 2>&1
            rc=$?
            echo "exit=$rc" >> hardening-debug.txt
            if [ $rc -ne 0 ]; then
              echo "FAILED_COMMAND=$cmd" >> hardening-debug.txt
              break
            fi
          done
          exit 0
      - name: Commit hardening diagnostic
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add hardening-debug.txt
          git diff --cached --quiet && exit 0
          git commit -m 'Capture fast hardening failure details [skip ci]'
          git pull --rebase
          git push
