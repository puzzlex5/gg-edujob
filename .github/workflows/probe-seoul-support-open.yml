name: Probe Seoul support-office detail opening

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4
      - name: Probe Gangnam-Seocho recruitment detail flow
        shell: bash
        run: |
          python - <<'PY'
          import re, requests
          from bs4 import BeautifulSoup

          board='https://gnscedu.sen.go.kr/FUS/JO/JOL11.do'
          detail='https://gnscedu.sen.go.kr/FUS/JO/JOV11.do'
          h={'User-Agent':'Mozilla/5.0 (Linux; Android 15) AppleWebKit/537.36 Chrome/140 Mobile Safari/537.36','Accept-Language':'ko-KR,ko;q=0.9'}
          s=requests.Session(); s.headers.update(h)
          r=s.get(board,timeout=25,allow_redirects=True)
          print('LIST',r.status_code,r.url,'len',len(r.text),'cookies',s.cookies.get_dict())
          r.raise_for_status()
          soup=BeautifulSoup(r.text,'html.parser')
          target=None
          for tr in soup.find_all('tr'):
            text=' '.join(tr.stripped_strings)
            if '대청중' in text and '음악' in text:
              target=tr; break
          if target is None:
            for tr in soup.find_all('tr'):
              html=str(tr)
              if re.search(r"fncDetailView\s*\(\s*['\"]?\d+",html,re.I):
                target=tr; break
          assert target is not None, 'no recruitment row with a stable job_seq'
          html=str(target); text=' '.join(target.stripped_strings)
          print('ROW_TEXT',text[:800])
          m=re.search(r"fncDetailView\s*\(\s*['\"]?(\d+)",html,re.I) or re.search(r"job_seq[=,'\"() ]+(\d+)",html,re.I)
          assert m, 'target row has no job_seq'
          seq=m.group(1); print('SEQ',seq)

          def inspect(label, resp):
            txt=BeautifulSoup(resp.text,'html.parser').get_text(' ',strip=True)
            hit_school='대청중학교' in txt
            hit_music='음악' in txt
            print(label,'status',resp.status_code,'final',resp.url,'len',len(resp.text),'school',hit_school,'music',hit_music,'elapsed',resp.elapsed.total_seconds())

          c=requests.Session(); c.headers.update(h)
          inspect('COLD_POST',c.post(detail,data={'job_seq':seq},headers={'Referer':board},timeout=25,allow_redirects=True))
          inspect('SEEDED_POST',s.post(detail,data={'job_seq':seq},headers={'Referer':board},timeout=25,allow_redirects=True))
          c2=requests.Session(); c2.headers.update(h)
          inspect('COLD_GET',c2.get(detail,params={'job_seq':seq},headers={'Referer':board},timeout=25,allow_redirects=True))
          inspect('SEEDED_GET',s.get(detail,params={'job_seq':seq},headers={'Referer':board},timeout=25,allow_redirects=True))
          PY
      - name: Verify persistent GET across all Seoul support offices
        shell: bash
        run: |
          python - <<'PY'
          import json,re,requests
          from pathlib import Path
          from bs4 import BeautifulSoup
          from urllib.parse import urljoin

          sources=json.loads(Path('sources.json').read_text(encoding='utf-8'))['seoul']['supportOffices']
          headers={'User-Agent':'Mozilla/5.0 (Linux; Android 15) AppleWebKit/537.36 Chrome/140 Mobile Safari/537.36','Accept-Language':'ko-KR,ko;q=0.9'}
          failures=[]; checked=0
          for src in sources:
            board=src['boardUrl']; sess=requests.Session(); sess.headers.update(headers)
            r=sess.get(board,timeout=25,allow_redirects=True); r.raise_for_status()
            soup=BeautifulSoup(r.text,'html.parser')
            row=None; seq=None; title=None; school=None
            for tr in soup.find_all('tr'):
              html=str(tr)
              m=re.search(r"fncDetailView\s*\(\s*['\"]?(\d+)",html,re.I)
              if not m: continue
              cells=[' '.join(td.stripped_strings) for td in tr.find_all('td')]
              anchors=[' '.join(a.stripped_strings) for a in tr.find_all('a') if ' '.join(a.stripped_strings)]
              title=max(anchors,key=len,default='').strip()
              school=next((x for x in cells if re.search(r'(유치원|초등학교|중학교|고등학교|학교)$',x)), '')
              if title:
                row=tr; seq=m.group(1); break
            if not seq:
              failures.append((src['name'],'no-seq')); continue
            detail=urljoin(board,'/FUS/JO/JOV11.do')
            g=requests.get(detail,params={'job_seq':seq},headers={**headers,'Referer':board},timeout=25,allow_redirects=True)
            txt=BeautifulSoup(g.text,'html.parser').get_text(' ',strip=True)
            title_ok=(title in txt) if title else False
            school_ok=(school in txt) if school else True
            final_ok=(g.url.startswith(detail+'?') and ('job_seq='+seq) in g.url)
            ok=g.status_code==200 and title_ok and school_ok and final_ok
            print(src['name'],'seq',seq,'status',g.status_code,'title_ok',title_ok,'school_ok',school_ok,'final_ok',final_ok,'title',title[:90])
            checked+=1
            if not ok: failures.append((src['name'],seq,title,school,g.status_code,g.url,title_ok,school_ok))
          print('checked',checked,'failures',failures)
          assert checked==len(sources), (checked,len(sources))
          assert not failures, failures
          PY
