name: Probe Lessoninfo cold deep links

on:
  push:
    branches:
      - diagnose/lessoninfo-cold-deeplinks-20260906
    paths:
      - '.github/workflows/probe-lessoninfo-cold-deeplinks.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Playwright
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps chromium
      - name: Probe cold vs seeded Lessoninfo detail routing
        run: |
          python - <<'PY'
          import asyncio, json, re
          from pathlib import Path
          from urllib.parse import urlparse
          from playwright.async_api import async_playwright

          MOBILE_UA = 'Mozilla/5.0 (Linux; Android 14; SM-S928N) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0.0.0 Mobile Safari/537.36'
          LIST = 'https://www.lessoninfo.co.kr/culture-jobs/list.php'
          TARGETS = [
              {
                  'kind':'culture','id':'94673',
                  'url':'https://www.lessoninfo.co.kr/culture-jobs/detail.php?id=94673',
                  'title':'국립박물관문화재단 2026년 3차 직원 채용',
                  'needle':'국립박물관문화재단',
              },
              {
                  'kind':'culture','id':'94870',
                  'url':'https://www.lessoninfo.co.kr/culture-jobs/detail.php?id=94870',
                  'title':'(재)포천문화관광재단 2026년 제5회 직원 공개채용 공고',
                  'needle':'포천문화관광재단',
              },
              {
                  'kind':'culture','id':'94879',
                  'url':'https://www.lessoninfo.co.kr/culture-jobs/detail.php?id=94879',
                  'title':'[광림아트센터] BBCH홀 / 장천홀 공연장안내원 모집공고',
                  'needle':'광림아트센터',
              },
              {
                  'kind':'afterschool','id':'7584',
                  'url':'https://www.lessoninfo.co.kr/board/board.php?bo_table=20170316171033_6494&board_code=20130529164321_7227&code=&wr_no=7584',
                  'title':'강남구 중학교 음악과 기간제 교사 채용 공고',
                  'needle':'음악',
              },
          ]

          async def body_text(page):
              try:
                  return await page.locator('body').inner_text(timeout=8000)
              except Exception:
                  return ''

          async def one(browser, target, mode):
              headers = {'Accept-Language':'ko-KR,ko;q=0.9'}
              if mode == 'referrer-only':
                  headers['Referer'] = LIST
              ctx = await browser.new_context(
                  locale='ko-KR', timezone_id='Asia/Seoul', user_agent=MOBILE_UA,
                  viewport={'width':390,'height':844}, extra_http_headers=headers,
              )
              page = await ctx.new_page()
              seed = None
              try:
                  if mode == 'seeded':
                      r0 = await page.goto(LIST, wait_until='domcontentloaded', timeout=45000)
                      await page.wait_for_timeout(1200)
                      seed = {
                          'status': r0.status if r0 else None,
                          'finalUrl': page.url,
                          'cookies': [c['name'] for c in await ctx.cookies()],
                      }
                  r = await page.goto(target['url'], wait_until='domcontentloaded', timeout=45000)
                  await page.wait_for_timeout(1400)
                  text = await body_text(page)
                  final = page.url
                  parsed = urlparse(final)
                  exact_path = parsed.path.endswith('/culture-jobs/detail.php') if target['kind']=='culture' else ('/board/board.php' in parsed.path and 'wr_no=7584' in final)
                  title_hit = target['needle'].lower() in text.lower()
                  list_like = parsed.path.endswith('/culture-jobs/list.php') or ('문화예술 일자리' in text and not title_hit)
                  return {
                      'mode': mode,
                      'status': r.status if r else None,
                      'requested': target['url'],
                      'finalUrl': final,
                      'exactPathShape': exact_path,
                      'titleHit': title_hit,
                      'listLike': list_like,
                      'bodyPrefix': re.sub(r'\\s+',' ',text)[:500],
                      'cookiesAfter': [c['name'] for c in await ctx.cookies()],
                      'seed': seed,
                  }
              except Exception as e:
                  return {'mode':mode,'requested':target['url'],'error':f'{type(e).__name__}: {e}'}
              finally:
                  await ctx.close()

          async def inspect_list(browser):
              ctx = await browser.new_context(locale='ko-KR', timezone_id='Asia/Seoul', user_agent=MOBILE_UA, viewport={'width':390,'height':844})
              page = await ctx.new_page()
              out = {'url':LIST,'anchors':{},'scripts':[]}
              try:
                  r = await page.goto(LIST, wait_until='domcontentloaded', timeout=45000)
                  await page.wait_for_timeout(1500)
                  out['status'] = r.status if r else None
                  out['finalUrl'] = page.url
                  for rid in ('94879','94870'):
                      loc = page.locator(f'a[href*="{rid}"]')
                      vals = []
                      for i in range(min(await loc.count(),5)):
                          a = loc.nth(i)
                          vals.append(await a.evaluate("a=>({href:a.getAttribute('href'),absHref:a.href,onclick:a.getAttribute('onclick'),text:(a.innerText||a.textContent||'').trim(),outer:a.outerHTML.slice(0,1200)})"))
                      out['anchors'][rid] = vals
                  out['scripts'] = await page.locator('script').evaluate_all("els=>els.map(s=>({src:s.src||'',text:(s.textContent||'').slice(0,3000)})).filter(x=>/detail\\.php|culture-jobs|goView|view/i.test(x.src+' '+x.text)).slice(0,20)")
              except Exception as e:
                  out['error'] = f'{type(e).__name__}: {e}'
              finally:
                  await ctx.close()
              return out

          async def main():
              async with async_playwright() as pw:
                  browser = await pw.chromium.launch(headless=True, args=['--disable-dev-shm-usage'])
                  result = {'listInspection': await inspect_list(browser), 'targets': []}
                  for t in TARGETS:
                      row = {'target':t, 'probes':[]}
                      for mode in ('cold','seeded','referrer-only'):
                          row['probes'].append(await one(browser,t,mode))
                      result['targets'].append(row)
                  await browser.close()
              Path('lessoninfo-deeplink-probe.json').write_text(json.dumps(result,ensure_ascii=False,indent=2),encoding='utf-8')
              print(json.dumps(result,ensure_ascii=False,indent=2))

          asyncio.run(main())
          PY
      - name: Upload probe evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lessoninfo-deeplink-probe-${{ github.run_id }}
          path: lessoninfo-deeplink-probe.json
          if-no-files-found: warn
          retention-days: 7
