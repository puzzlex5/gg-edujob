name: Audit support 7424 to 7353 diff

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/audit_support_71_diff.py'
      - 'scripts/support_population_contract.py'
      - 'jobs.json'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install requests
      - name: Audit exact historical/current ID diff
        run: python scripts/audit_support_71_diff.py
      - name: Persist audit evidence
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add support_71_diff_audit.json
          git diff --cached --quiet && exit 0
          git commit -m 'Record support 71-ID diff classification'
          git pull --rebase origin main
          git push origin HEAD:main
# Trigger-only comment: rerun exact population contract audit after contract hardening.
