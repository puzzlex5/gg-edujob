name: Probe JobTeacher source

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/probe_jobteacher.py'
      - '.github/workflows/probe-jobteacher.yml'

permissions:
  contents: write

concurrency:
  group: metro-edujob-jobteacher-probe
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Synchronize main
        run: |
          git fetch origin main
          git checkout -B main origin/main
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install probe dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt playwright
          python -m playwright install --with-deps chromium
      - name: Syntax check
        run: python -m py_compile scripts/probe_jobteacher.py
      - name: Probe JobTeacher public recruitment structure
        id: probe
        continue-on-error: true
        run: python scripts/probe_jobteacher.py
      - name: Validate report safety gate
        if: always()
        run: |
          python - <<'PY'
          import json, pathlib
          p=pathlib.Path('jobteacher_probe_report.json')
          assert p.exists(), 'probe report missing'
          d=json.load(p.open(encoding='utf-8'))
          assert d.get('publicationEnabled') is False, 'probe must never publish jobs'
          assert d.get('mode') == 'read-only-onboarding-probe'
          td=d.get('transportDiagnostics') or {}
          assert td.get('certificateVerificationDisabled') is False, 'TLS verification must not be disabled'
          print(json.dumps(d.get('summary',{}),ensure_ascii=False))
          PY
      - name: Commit probe evidence
        if: always()
        run: |
          test -f jobteacher_probe_report.json || exit 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add jobteacher_probe_report.json
          git diff --cached --quiet && exit 0
          git commit -m 'Record JobTeacher source probe'
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && break
            sleep $((i*4))
          done
      - name: Fail visibly only when probe execution failed
        if: steps.probe.outcome != 'success'
        run: exit 1
