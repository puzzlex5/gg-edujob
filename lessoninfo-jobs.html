<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>학원·민간 구인 | 수도권에듀잡</title>
<meta name="description" content="레슨인포 등 민간 출처의 수도권 교육·예체능 구인공고를 모아 보는 수도권에듀잡 별도 탭">
<style>
:root{--green:#03c75a;--ink:#172033;--muted:#6b7788;--line:#e4e8ee;--bg:#f5f7fa;--card:#fff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif}a{text-decoration:none;color:inherit}.wrap{max-width:1120px;margin:auto;padding:0 16px}.head{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10}.headin{height:64px;display:flex;align-items:center;gap:14px}.brand{font-weight:900;font-size:18px}.tabs{display:flex;gap:6px}.tab{padding:9px 12px;border-radius:10px;font-size:13px;font-weight:800;color:#667085}.tab.on{background:#eafaf0;color:#087a42}.hero{padding:25px 0 14px}.hero h1{margin:0 0 8px;font-size:25px;letter-spacing:-.6px}.hero p{margin:0;color:var(--muted);font-size:13px;line-height:1.6}.notice{margin-top:12px;background:#fff8e8;border:1px solid #f4dfaa;padding:11px 13px;border-radius:12px;font-size:12px;color:#785b14}.search{display:flex;gap:8px;margin:16px 0}.search input,.search select{border:1px solid var(--line);background:#fff;border-radius:11px;padding:12px;font:inherit}.search input{flex:1;min-width:0}.search select{width:170px}.bar{display:flex;justify-content:space-between;align-items:center;margin:10px 2px}.bar strong{font-size:19px}.list{display:grid;gap:10px;padding-bottom:50px}.job{display:block;background:var(--card);border:1px solid var(--line);border-radius:15px;padding:16px;box-shadow:0 2px 8px rgba(20,30,50,.03)}.badges{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}.badge{font-size:10px;padding:5px 7px;border-radius:7px;background:#f0f3f6;color:#596574;font-weight:800}.badge.private{background:#fff1dd;color:#9a5a00}.badge.metro{background:#eafaf0;color:#087a42}.job h2{font-size:16px;line-height:1.45;margin:0 0 7px}.meta{font-size:11px;color:var(--muted);display:flex;gap:12px;flex-wrap:wrap}.more{width:100%;padding:13px;border:1px solid var(--line);background:#fff;border-radius:12px;font-weight:800;cursor:pointer}.empty{padding:40px;text-align:center;background:#fff;border:1px dashed #ccd3dc;border-radius:14px;color:var(--muted)}.status{font-size:11px;color:#8490a0;margin:6px 0 15px}@media(max-width:650px){.headin{height:auto;padding:10px 0;align-items:flex-start;flex-direction:column}.tabs{width:100%}.tab{flex:1;text-align:center}.hero{padding-top:18px}.hero h1{font-size:21px}.search{flex-direction:column}.search select{width:100%}}
</style>
</head>
<body>
<header class="head"><div class="wrap headin"><a class="brand" href="./">🎓 수도권에듀잡</a><nav class="tabs"><a class="tab" href="./">학교·교육청 채용</a><a class="tab on" href="lessoninfo-jobs.html">학원·민간 구인</a></nav></div></header>
<main class="wrap"><section class="hero"><h1>학원·민간 구인</h1><p>학원강사·음악강사·방과후·늘봄·음악단체·기관 등 사람을 채용하는 구인공고만 모읍니다. 학원 매매, 악기 판매, 연습실, 구직·홍보 글은 제외합니다.</p><div class="notice">민간 출처 공고입니다. 지원 전 근무조건과 모집 여부를 반드시 원문에서 다시 확인하세요. 학교·교육청 공식공고는 왼쪽 탭에서 별도로 제공합니다.</div></section>
<div class="search"><input id="q" type="search" placeholder="학원명, 학교명, 과목, 제목 검색"><select id="scope"><option value="all">전체</option><option value="metro">서울·경기 확인</option><option value="review">지역 확인 필요</option></select></div>
<div class="bar"><div><strong id="count">0</strong>개 구인공고</div><span id="updated" class="status"></span></div><div id="list" class="list"></div></main>
<script>
const $=s=>document.querySelector(s);let jobs=[],limit=80,timer=0;const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function filtered(){const q=$('#q').value.trim().toLowerCase(),scope=$('#scope').value;return jobs.filter(j=>{if(scope==='metro'&&!j.metroConfirmed)return false;if(scope==='review'&&!j.needsLocationReview)return false;if(!q)return true;return [j.title,j.source,j.registered].join(' ').toLowerCase().includes(q)})}
function card(j){return `<a class="job" href="${esc(j.originalUrl||j.url)}" target="_blank" rel="noopener"><div class="badges"><span class="badge private">민간출처 · 레슨인포</span>${j.metroConfirmed?'<span class="badge metro">서울·경기 확인</span>':'<span class="badge">지역 확인 필요</span>'}</div><h2>${esc(j.title||'구인공고')}</h2><div class="meta"><span>등록 ${esc(j.registered||'원문 확인')}</span><span>ID ${esc(j.sourceIdentity||'')}</span><span>원문 바로가기 ↗</span></div></a>`}
function render(reset=true){if(reset)limit=80;const a=filtered();$('#count').textContent=a.length.toLocaleString();if(!a.length){$('#list').innerHTML='<div class="empty">조건에 맞는 구인공고가 없습니다.</div>';return}const shown=a.slice(0,limit);$('#list').innerHTML=shown.map(card).join('')+(a.length>shown.length?`<button class="more" id="more">공고 더 보기 (${shown.length.toLocaleString()} / ${a.length.toLocaleString()})</button>`:'');$('#more')?.addEventListener('click',()=>{limit+=80;render(false)})}
async function load(){try{const r=await fetch('lessoninfo_jobs.json',{cache:'no-cache'});if(!r.ok)throw 0;const d=await r.json();jobs=Array.isArray(d)?d:(d.jobs||[]);$('#updated').textContent=d.updatedAt?`최근 갱신 ${d.updatedAt}`:'';render()}catch(e){$('#list').innerHTML='<div class="empty">민간 구인 데이터가 아직 검증 중이거나 일시적으로 불러와지지 않습니다. 기존 학교·교육청 채용 데이터에는 영향이 없습니다.</div>'}}
$('#q').addEventListener('input',()=>{clearTimeout(timer);timer=setTimeout(()=>render(),180)});$('#scope').addEventListener('change',()=>render());load();
</script>
</body></html>
