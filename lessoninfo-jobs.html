<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>레슨인포 구인 | 수도권에듀잡</title>
<meta name="description" content="레슨인포의 방과후교사·늘봄학교 강사와 문화예술 채용 중 현재 구인공고만 모아 보는 수도권에듀잡 민간 구인 화면">
<style>
:root{--green:#03c75a;--ink:#172033;--muted:#6b7788;--line:#e4e8ee;--bg:#f5f7fa;--card:#fff;--warn:#9a5a00}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif}a{text-decoration:none;color:inherit}.wrap{max-width:1120px;margin:auto;padding:0 16px}.head{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10}.headin{min-height:64px;display:flex;align-items:center;gap:14px}.brand{font-weight:900;font-size:19px;color:var(--green)}.tabs{display:flex;gap:6px}.tab{padding:9px 12px;border:1px solid #e1e5e9;border-radius:10px;font-size:13px;font-weight:800;color:#667085;background:#fff}.tab.on{background:#eafaf0;color:#087a42;border-color:#a7dfbd}.hero{padding:22px 0 10px}.hero h1{margin:0 0 7px;font-size:25px;letter-spacing:-.6px}.hero p{margin:0;color:var(--muted);font-size:13px;line-height:1.65}.notice{margin-top:11px;background:#fff8e8;border:1px solid #f4dfaa;padding:11px 13px;border-radius:12px;font-size:12px;color:#785b14}.sourcecards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:13px 0}.sourcecard{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px}.sourcecard b{display:block;font-size:19px;margin-bottom:4px}.sourcecard span{font-size:11px;color:var(--muted)}.sourcecard.ok b{color:#07863c}.search{display:flex;gap:8px;margin:14px 0}.search input,.search select{border:1px solid var(--line);background:#fff;border-radius:11px;padding:12px;font:inherit}.search input{flex:1;min-width:0}.search select{width:210px}.bar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:9px 2px}.bar strong{font-size:19px}.status{font-size:11px;color:#8490a0;text-align:right}.list{display:grid;gap:9px;padding-bottom:50px}.job{display:block;background:var(--card);border:1px solid var(--line);border-radius:13px;padding:15px;box-shadow:0 2px 8px rgba(20,30,50,.03)}.job:hover{border-color:#b8dfc7}.badges{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}.badge{font-size:10px;padding:5px 7px;border-radius:7px;background:#f0f3f6;color:#596574;font-weight:800}.badge.private{background:#fff1dd;color:var(--warn)}.badge.after{background:#eafaf0;color:#087a42}.badge.culture{background:#edf4ff;color:#295e9b}.job h2{font-size:16px;line-height:1.45;margin:0 0 7px}.meta{font-size:11px;color:var(--muted);display:flex;gap:12px;flex-wrap:wrap}.more{width:100%;padding:13px;border:1px solid var(--line);background:#fff;border-radius:12px;font-weight:800;cursor:pointer}.empty{padding:40px;text-align:center;background:#fff;border:1px dashed #ccd3dc;border-radius:14px;color:var(--muted)}.verify{margin:0 0 13px;font-size:11px;color:#667085}.verify strong{color:#087a42}@media(max-width:650px){.headin{height:auto;padding:10px 0;align-items:flex-start;flex-direction:column}.tabs{width:100%}.tab{flex:1;text-align:center}.hero{padding-top:17px}.hero h1{font-size:21px}.sourcecards{grid-template-columns:1fr}.search{flex-direction:column}.search select{width:100%}.bar{align-items:flex-start;flex-direction:column}.status{text-align:left}}
</style>
</head>
<body>
<header class="head"><div class="wrap headin"><a class="brand" href="./">S 수도권에듀잡</a><nav class="tabs"><a class="tab" href="./">학교·교육청 채용</a><a class="tab on" href="lessoninfo-jobs.html">학원·민간 구인</a></nav></div></header>
<main class="wrap">
<section class="hero"><h1>레슨인포 구인공고</h1><p>레슨인포의 <b>방과후교사·늘봄학교 강사</b>와 <b>문화예술 채용</b>에서 사람을 뽑는 현재 구인공고만 수집합니다. 구직, 학원 매매, 악기 판매, 연습실, 홍보 글과 마감·완료된 공고는 제외합니다.</p><div class="notice">민간 출처입니다. 지원 전 모집 여부와 접수 방법은 반드시 레슨인포 원문에서 최종 확인하세요.</div></section>
<div class="sourcecards"><div class="sourcecard ok"><b id="totalSource">-</b><span>레슨인포 현재 구인</span></div><div class="sourcecard"><b id="afterSource">-</b><span>방과후교사·늘봄학교 강사</span></div><div class="sourcecard"><b id="cultureSource">-</b><span>문화예술 채용</span></div></div>
<div id="verify" class="verify">레슨인포 수집 검증 정보를 불러오는 중입니다.</div>
<div class="search"><input id="q" type="search" placeholder="학교·기관·학원·과목·공고명·지역 검색"><select id="scope"><option value="all">전체 구인</option><option value="afterschool-nulbom">방과후·늘봄</option><option value="culture-arts">문화예술 채용</option></select></div>
<div class="bar"><div><strong id="count">0</strong>개 현재 구인공고</div><span id="updated" class="status"></span></div><div id="list" class="list"></div>
</main>
<script>
const $=s=>document.querySelector(s);let jobs=[],limit=80,timer=0;const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=()=>{const d=new Date();d.setHours(23,59,59,999);return d};
function dateOf(s){const m=String(s||'').match(/(20\d{2})-(\d{2})-(\d{2})/);return m?new Date(+m[1],+m[2]-1,+m[3],23,59,59):null}
function safeCurrent(j){const t=String(j.title||'').trim();if(!t)return false;if(/^문화예술\s*일자리(?:\s*[\d,]+건)?$/i.test(t))return false;const reg=dateOf(j.registered);if(reg&&reg>today())return false;const end=dateOf(j.applyEnd);if(end&&end<new Date(new Date().setHours(0,0,0,0)))return false;return true}
function filtered(){const q=$('#q').value.trim().toLowerCase(),scope=$('#scope').value;return jobs.filter(j=>{if(!safeCurrent(j))return false;if(scope!=='all'&&j.sourceSurface!==scope)return false;if(!q)return true;return [j.title,j.source,j.registered,j.location,j.sourceSurfaceLabel].join(' ').toLowerCase().includes(q)})}
function card(j){const kind=j.sourceSurface==='afterschool-nulbom'?'방과후·늘봄':'문화예술 채용';const cls=j.sourceSurface==='afterschool-nulbom'?'after':'culture';return `<a class="job" href="${esc(j.originalUrl||j.url)}" target="_blank" rel="noopener"><div class="badges"><span class="badge private">민간출처 · 레슨인포</span><span class="badge ${cls}">${kind}</span>${j.location?`<span class="badge">${esc(j.location)}</span>`:''}</div><h2>${esc(j.title||'구인공고')}</h2><div class="meta"><span>등록 ${esc(j.registered||'원문 확인')}</span>${j.applyEnd?`<span>마감 ${esc(j.applyEnd)}</span>`:''}<span>원문 바로가기 ↗</span></div></a>`}
function render(reset=true){if(reset)limit=80;const a=filtered();$('#count').textContent=a.length.toLocaleString();if(!a.length){$('#list').innerHTML='<div class="empty">조건에 맞는 현재 구인공고가 없습니다.</div>';return}const shown=a.slice(0,limit);$('#list').innerHTML=shown.map(card).join('')+(a.length>shown.length?`<button class="more" id="more">공고 더 보기 (${shown.length.toLocaleString()} / ${a.length.toLocaleString()})</button>`:'');$('#more')?.addEventListener('click',()=>{limit+=80;render(false)})}
async function load(){try{const [jr,rr]=await Promise.all([fetch('lessoninfo_jobs.json',{cache:'no-cache'}),fetch('lessoninfo_reconciliation_report.json',{cache:'no-cache'})]);if(!jr.ok)throw 0;const d=await jr.json();jobs=Array.isArray(d)?d:(d.jobs||[]);$('#updated').textContent=d.updatedAt?`최근 갱신 ${d.updatedAt}`:'';if(rr.ok){const r=await rr.json();const per=r.perSurfaceActive||{};$('#totalSource').textContent=Number(r.activeIdCount??r.publishedIdCount??jobs.length).toLocaleString()+'건';$('#afterSource').textContent=Number(per['afterschool-nulbom']||0).toLocaleString()+'건';$('#cultureSource').textContent=Number(per['culture-arts']||0).toLocaleString()+'건';const good=r.healthy===true&&r.traversalComplete===true&&Number(r.missingAfterCount||0)===0&&Number(r.detailErrorCount||0)===0;$('#verify').innerHTML=good?`<strong>수집 검증 정상</strong> · 두 게시판 순회 완료 · 안정 ID 누락 ${Number(r.missingAfterCount||0)}건 · 상세 오류 ${Number(r.detailErrorCount||0)}건`:'수집 결과를 재검증 중입니다. 직전 정상 데이터는 보존됩니다.'}else{$('#totalSource').textContent=jobs.length.toLocaleString()+'건'}render()}catch(e){$('#list').innerHTML='<div class="empty">레슨인포 구인 데이터를 불러오지 못했습니다. 자동 수집기가 재시도합니다.</div>';$('#verify').textContent='수집 상태 확인 실패'}}
$('#q').addEventListener('input',()=>{clearTimeout(timer);timer=setTimeout(()=>render(),180)});$('#scope').addEventListener('change',()=>render());load();
</script>
</body></html>
